<title>Pura Vida</title>
<style>
:root{
  --ink:#0E1B2C;--muted:#566170;--line:#E3E7EC;--bg:#F4F6F8;--card:#FFFFFF;
  --teal:#0F766E;--teal-soft:#CCFBF1;--amber:#B45309;--amber-soft:#FEF3C7;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.view{padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.tight{padding:6px 16px}
h1{margin:0;font-size:24px;font-family:var(--num);font-weight:700}
h2{margin:0;font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.lbl{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.num{font-family:var(--num);font-weight:700}
.big{font-size:34px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.amber{background:var(--amber-soft);color:#92400E}
.bar{height:8px;background:#E8ECF0;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.list>.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:none}
.item .grow{flex:1;min-width:0}
.item p{margin:0}
.t15{font-size:15px;font-weight:600}
.btn{height:50px;border-radius:14px;border:none;background:var(--teal);color:#fff;font-weight:600;font-size:16px;padding:0 18px;cursor:pointer;width:100%}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:1px dashed #9AA5B1}
.btn.danger{background:#fff;color:var(--red);border:1px solid #FECACA}
.btn.sm{height:38px;font-size:14px;width:auto;border-radius:11px;padding:0 14px}
.iconbtn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:500;color:var(--muted)}
.input{height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:16px;width:100%;outline:none}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#566170 50%),linear-gradient(135deg,#566170 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;gap:4px;background:#E6EAEE;padding:4px;border-radius:12px}
.seg button{flex:1;min-height:38px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,27,44,.15)}

.hero .v{margin:4px 0 0;font-size:54px;line-height:1;letter-spacing:-1.5px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;background:#22334A}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}

.legend b{color:#fff;margin-left:auto;font-weight:600}
.dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(76px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 6px 0;z-index:20}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%}

.note.green{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}

.rank.on{background:var(--ink);color:#fff}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:16px 8px}

  .btn{color:#0B121C}

  .chip.on{background:#E8EDF3;color:#0B121C}

  .note.green{background:#0B2A22;color:#A7F3D0;border-color:#14532D}

  .shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  .shortcuts svg{color:var(--teal)}

/* ---------- Utilitários ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('pt-PT', { style:'currency', currency:'EUR' });
const fmt0 = new Intl.NumberFormat('pt-PT', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const eur = v => fmt.format(Math.round((v||0)*100)/100);
const eur0 = v => fmt0.format(Math.round(v||0));
const r2 = v => Math.round((v||0)*100)/100;

const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;

const parseNum = s => { if (s === '' || s == null) return NaN; return parseFloat(String(s).replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); };
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const lastDay = (y,m) => new Date(y, m, 0).getDate(); // m 1-12
const daysLeftInMonth = () => { const t = today(); return lastDay(t.getFullYear(), t.getMonth()+1) - t.getDate() + 1; };
const shortDate = isoStr => { const [y,m,d] = isoStr.split('-').map(Number); return `${d} ${MES3[m-1]}`; };

const ICONS = {
  card:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>',

  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

const ic = (n, size=22, sw=1.8) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- Encriptação ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv:b64(iv), ct:b64(ct) };
}
async function decryptJSON(key, box){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(box.iv) }, key, unb64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* Chave dos dados (aleatória) guardada duas vezes: com a palavra-passe e com o código de recuperação */
const RC_ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const rand16 = () => crypto.getRandomValues(new Uint8Array(16));
function newRecoveryCode(){
  let out = '';
  while (out.length < 24){ for (const x of crypto.getRandomValues(new Uint8Array(32))){ if (x < 248 && out.length < 24) out += RC_ALPHA[x % 31]; } }
  return out.match(/.{4}/g).join('-');
}
const normCode = c => String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
async function encBytes(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, bytes); return { iv:b64(iv), ct:b64(ct) }; }
async function decBytes(key, box){ return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(box.iv) }, key, unb64(box.ct))); }
const importDEK = raw => crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
async function newVaultKeys(pass){
  const raw = crypto.getRandomValues(new Uint8Array(32)); const iter = 310000;
  const saltP = rand16(), saltR = rand16(); const code = newRecoveryCode();
  const wrapP = await encBytes(await deriveKey(pass, saltP, iter), raw);
  const wrapR = await encBytes(await deriveKey(normCode(code), saltR, iter), raw);
  DEK_RAW = raw; KEY = await importDEK(raw);
  return { fields:{ v:2, iter, saltP:b64(saltP), wrapP, saltR:b64(saltR), wrapR }, code };
}
async function openWithPass(vault, pass){
  if (vault.v === 2){
    const raw = await decBytes(await deriveKey(pass, unb64(vault.saltP), vault.iter), vault.wrapP);
    const key = await importDEK(raw);
    return { key, raw, data: vault.ct ? await decryptJSON(key, vault) : null };
  }
  const key = await deriveKey(pass, unb64(vault.salt), vault.iter);
  return { key, raw:null, data: await decryptJSON(key, vault), legacy:true };
}
async function openWithCode(vault, code){

/* Recibo verde: valor do serviço + IVA − IRS retido pelo cliente = o que entra na conta.

function receitaCalc(s, base, comIva, retPct){
  const r = s.rules; base = r2(base); retPct = +retPct || 0;
  const iva = comIva ? r2(base * r.ivaTaxa) : 0;
  const ret = r2(base * retPct / 100);
  const ss = r2(base * r.ssCoeficiente * r.ssTaxa);
  const irs = r2(base * Math.max(0, (s.settings.irsPct || 0) - retPct) / 100);
  return { base, iva, ret, retPct, valor: r2(base + iva - ret), reservas:{ iva, ss, irs } };
}
function addReceita(s, { data, desc, base, comIva, cat, retPct }){
  if (retPct === undefined) retPct = s.settings.retencaoPadrao || 0;
  const c = receitaCalc(s, base, comIva, retPct);
  const mov = { id:uid(), data, tipo:'receita', valor:c.valor, base:c.base, iva:c.iva, retencao:c.ret, retPct:c.retPct, comIva:!!comIva, cat: cat || 'Recibos verdes', desc, reservas:c.reservas };

function guessCategory(text){
  const t = norm(text);
  const learned = (S.importRules || {})[ruleKey(text)]; if (learned && learned.kind === 'despesa' && S.categories.some(c => c.nome === learned.cat)) return learned.cat;
  let best = null, len = 0;
  for (const c of S.categories) for (const k of (c.kw || [])){
    const nk = norm(k); if (!nk || nk.length <= len) continue;
    if (new RegExp(`(^|[^a-z0-9])${nk.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')}([^a-z0-9]|$)`).test(t)){ best = c.nome; len = nk.length; }
  }
  if (best) return best;
  for (const c of S.categories){
    for (const k of (c.kw || [])) if (k && new RegExp(`(^|[^a-z0-9])${norm(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')}([^a-z0-9]|$)`).test(t)) return c.nome;
  }

  const prev = [...S.movs].reverse().find(m => m.tipo === 'despesa' && m.desc && t.includes(norm(m.desc)));

function parseQuick(text){
  let raw = String(text || '').trim();

  const rm = norm(raw).match(/reten[c]?[a]?o\s*(?:de\s*)?(\d{1,2})\s*%?/);
  if (rm){ retPct = +rm[1]; raw = raw.replace(/reten[çc][ãa]o\s*(de\s*)?\d{1,2}\s*%?/i, ' '); }
  if (/sem\s+reten/i.test(norm(raw))){ retPct = 0; raw = raw.replace(/sem\s+reten[çc][ãa]o/i, ' '); }
  const sm = norm(raw).match(/\b(a meias|dividid[oa]|partilhad[oa]|com a diana|splitwise)\b/);
  if (sm){ share = 50; raw = raw.replace(/\b(a meias|dividid[oa]|partilhad[oa]|com a diana|no splitwise)\b/i, ' ').trim(); }
  const t = norm(raw);
  const numMatch = raw.match(/(\d+(?:[.\s]\d{3})*(?:[.,]\d{1,2})?)\s*(?:€|eur|euros)?/gi);
  let valor = NaN;
  if (numMatch){ valor = parseNum(numMatch[numMatch.length-1].replace(/€|eur(os)?/i,'')); }
  let desc = raw.replace(/(\d+(?:[.\s]\d{3})*(?:[.,]\d{1,2})?)\s*(€|eur|euros)?/gi, '').replace(/\b(com|sem)\s+iva\b/gi,'').replace(/\s+/g,' ').trim();
  const isReceita = /^(recibo|recebi|receita|pagamento de|fatura|factura)\b/.test(t);
  if (isReceita){
    const comIva = /\bcom\s+iva\b/.test(t) || (!/\bsem\s+iva\b/.test(t) && /^recibo/.test(t));
    desc = desc.replace(/^(recebi|receita)\s*/i,'').replace(/^(da|do|de|dos|das)\s+/i,'');
    desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : 'Recibo';
    return { tipo:'receita', valor, desc, comIva, retPct };
  }
  desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : '';

}

function matchDebt(t, list = S.debts.filter(d => d.saldo > 0.005)){

}
function matchGoal(t){

function movRow(m){

  const color = entra ? 'color:var(--teal)' : '';
  const sub = (m.historico ? 'histórico · ' : '') + (m.mesRef ? `conta para ${MESES[+m.mesRef.slice(5,7) - 1]} · ` : '') + (m.partilha ? `dividido (Diana ${eur(m.partilha.valor)}) · ` : '') + (m.tipo === 'receita' ? (m.cat === 'Outras entradas' ? 'entrada' : (m.comIva ? `IVA ${eur(m.iva)} e SS reservados` : 'SS reservada') + (m.retencao ? ` · IRS retido ${eur(m.retencao)}` : '')) :
              m.tipo === 'transferencia' ? `${m.valor < 0 ? 'tirado de' : 'para'} ${esc(S.goals.find(g => g.id === m.metaId)?.nome || 'meta')}` :
              m.tipo === 'divida' ? 'pagamento de dívida' : esc(m.cat));
  return `<button class="item" data-mov="${m.id}" style="width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;cursor:pointer;color:inherit"><div class="grow"><p class="t15">${esc(m.desc || m.cat || '—')}</p><p class="small muted">${sub} · ${shortDate(m.data)}</p></div><p class="num" style="font-size:15px;${color}">${sign}${eur(Math.abs(m.valor))}</p></button>`;
}

/* "Pago": pagaste agora (sai da conta) ou já estava pago antes de começares (não mexe no saldo)? */

      $('#pcNow', sh).onclick = () => {

    });
}

/* Dividir uma despesa com a Diana: a parte dela abate ao que deves no Splitwise */
function splitwiseDebt(){ let d = S.debts.find(x => x.tipo === 'splitwise'); if (!d){ d = { id:uid(), nome:'Splitwise', tipo:'splitwise', saldo:0, prestacao:0, taeg:0, dia:0, nota:'Diana' }; S.debts.push(d); } return d; }
function removeShare(m){ if (!m.partilha) return; const d = S.debts.find(x => x.id === m.partilha.debtId); if (d && !m.historico) d.saldo = r2(d.saldo + m.partilha.valor); delete m.partilha; }
function applyShare(m, pct){ removeShare(m); pct = +pct || 0; if (!pct) return; const d = splitwiseDebt(); const v = r2(m.valor * pct / 100); m.partilha = { pct, valor:v, debtId:d.id }; if (!m.historico) d.saldo = r2(d.saldo - v); }
const SHARE_OPTS = [['0','Não dividir'],['50','A meias (50%)'],['100','É tudo da Diana (100%)'],['33','A Diana paga 1/3'],['67','A Diana paga 2/3']];
function payDebt(d, valor, data = iso(today())){
  S.movs.push({ id:uid(), data, tipo:'divida', valor:r2(valor), dividaId:d.id, desc:d.nome });
  d.saldo = r2(d.saldo - valor);
  save();
}
function bindMovRows(){

function movSheet(id){

    <div class="item"><p class="grow muted">IVA</p><p class="t15">${eur(m.iva)}</p></div>
    <div class="item"><p class="grow muted">Reservado SS</p><p class="t15">${eur(m.reservas?.ss)}</p></div>
    <div class="item"><p class="grow muted">Reservado IRS</p><p class="t15">${eur(m.reservas?.irs)}</p></div></div></div>` : '';
  openSheet(`<div class="between"><h2>${esc(m.desc || m.cat)}</h2><button class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>
    <p class="num big" style="margin:0">${m.tipo==='receita'?'+':'−'} ${eur(m.valor)}</p>
    <p class="muted" style="margin:0">${shortDate(m.data)} · ${esc({despesa:'Despesa',receita:'Receita',transferencia:'Transferência para meta',divida:'Pagamento de dívida'}[m.tipo])}${m.cat ? ' · ' + esc(m.cat) : ''}</p>
    ${extra}
    <button class="btn" id="mvEdit">Editar</button>
    <button class="btn danger" id="mvDel">${ic('trash',18)} Apagar registo</button>`, sh => {
      $('#mvEdit', sh).onclick = () => editMov(m);
      $('#mvDel', sh).onclick = async () => {
        if (!await ask('Apagar este registo?', { ok:'Apagar', danger:true })) return;
        if (m.tipo === 'divida' && !m.historico){ const d = S.debts.find(x => x.id === m.dividaId); if (d) d.saldo = r2(d.saldo + m.valor); }
        if (m.tipo === 'transferencia' && !m.historico){ const g = S.goals.find(x => x.id === m.metaId); if (g) g.saldo = r2(g.saldo - m.valor); }
        removeShare(m);
        S.movs = S.movs.filter(x => x.id !== m.id); save(); closeSheet(); render();
      };
    }, () => render());
}

function editMov(m){
  const date = { k:'data', label:'Data', type:'date', value:m.data };
  const mes = { k:'mesRef', label:'Conta para o mês (opcional)', type:'month', value:m.mesRef || '', hint:'Ex.: recibo de 27 out que é para viver em novembro. Vazio = o mês da data.' };
  const setMes = out => { const v = (out.mesRef || '').slice(0,7); if (v && v !== (out.data || m.data).slice(0,7)) m.mesRef = v; else delete m.mesRef; };
  if (m.tipo === 'despesa'){
    formSheet('Editar despesa', [
      { k:'desc', label:'Descrição', value:m.desc || '' },
      { k:'valor', label:'Valor', type:'num', value:m.valor },
      { k:'cat', label:'Categoria', type:'select', options:S.categories.map(c => c.nome), value:m.cat },
      { k:'share', label:'Dividir com a Diana (Splitwise)', type:'select', options:SHARE_OPTS, value:String(m.partilha?.pct || 0) }, date, mes
    ], out => {
      if (!(out.valor > 0)){ toast('Indica um valor'); return false; }
      let cat = out.cat; const nd = out.desc.trim();
      if (nd && nd !== m.desc && cat === m.cat){ const g = guessCategory(nd); if (g !== 'Outros') cat = g; }   // mudaste o nome e não a categoria: sugere a certa
      removeShare(m);
      Object.assign(m, { desc:nd || cat, valor:r2(out.valor), cat, data:out.data || m.data }); setMes(out);
      applyShare(m, out.share);
      learnCategory(m.desc, m.cat); toast('Despesa alterada');
    });
  } else if (m.tipo === 'receita' && m.cat !== 'Outras entradas'){
    formSheet('Editar recibo', [
      { k:'desc', label:'Descrição', value:m.desc || '' },
      { k:'base', label:'Valor do serviço (sem IVA)', type:'num', value:m.base },
      { k:'iva', label:'IVA', type:'select', options:[['1', `Com IVA ${Math.round(S.rules.ivaTaxa*100)}%`], ['0', 'Sem IVA / isento']], value:m.comIva ? '1' : '0' },
      { k:'ret', label:'IRS retido pelo cliente', type:'select', options:RET_OPTS, value:String(m.retPct || 0) }, date, mes
    ], out => {
      if (!(out.base > 0)){ toast('Indica um valor'); return false; }
      const c = receitaCalc(S, out.base, out.iva === '1', +out.ret);
      Object.assign(m, { desc:out.desc.trim() || 'Recibo', base:c.base, iva:c.iva, retencao:c.ret, retPct:c.retPct, comIva:out.iva === '1', valor:c.valor, data:out.data || m.data, reservas:c.reservas }); setMes(out);
      toast(`Recibo alterado: entra na conta ${eur(c.valor)}`);
    });
  } else if (m.tipo === 'receita'){
    formSheet('Editar entrada', [{ k:'desc', label:'Descrição', value:m.desc || '' }, { k:'valor', label:'Valor', type:'num', value:m.valor }, date, mes], out => {
      if (!(out.valor > 0)){ toast('Indica um valor'); return false; }
      Object.assign(m, { desc:out.desc.trim() || 'Entrada', valor:r2(out.valor), base:r2(out.valor), data:out.data || m.data }); setMes(out);
    });
  } else {
    const isD = m.tipo === 'divida';
    const neg = !isD && m.valor < 0;
    formSheet(isD ? 'Editar pagamento de dívida' : neg ? 'Editar dinheiro tirado da meta' : 'Editar transferência', [{ k:'valor', label:'Valor', type:'num', value:Math.abs(m.valor) }, date, mes], out => {
      if (!(out.valor > 0)){ toast('Indica um valor'); return false; }
      if (neg) out.valor = -out.valor;
      const diff = r2(out.valor - m.valor);
      if (!m.historico){
        if (isD){ const d = S.debts.find(x => x.id === m.dividaId); if (d) d.saldo = r2(d.saldo - diff); }
        else { const g = S.goals.find(x => x.id === m.metaId); if (g) g.saldo = r2(g.saldo + diff); }
      }
      Object.assign(m, { valor:r2(out.valor), data:out.data || m.data }); setMes(out);
    });
  }
}
const RET_OPTS = [['0','Sem retenção'],['23','23%'],['25','25%'],['20','20%'],['16.5','16,5%'],['11.5','11,5%']];
/* aprende: a mesma descrição passa a ir para a categoria que escolheste */

/* ---------- Sheet / formulários ---------- */
let sheetOnClose = null;
function openSheet(html, bind, onClose){
  closeSheet(true);
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheetBg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  sheetOnClose = onClose || null;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
  if (bind) bind(bg.firstElementChild);
  const f = bg.querySelector('input,select,textarea'); if (f && !f.dataset.nofocus) setTimeout(() => f.focus(), 50);
}
function closeSheet(silent){
  const bg = $('#sheetBg'); if (bg) bg.remove();
  const cb = sheetOnClose; sheetOnClose = null;
  if (!silent && cb) cb();
}
/* Diálogo próprio (substitui confirm/prompt do sistema) */
function ask(msg, { input = null, ok = 'Confirmar', danger = false, placeholder = '', value = '' } = {}){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; closeSheet(true); resolve(v); };
    openSheet(`<p style="margin:0;font-size:16px;white-space:pre-line">${esc(msg)}</p>
      ${input ? `<input class="input" id="askIn" type="${input}" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off">` : ''}
      <button class="btn ${danger ? 'danger' : ''}" id="askOk">${esc(ok)}</button>
      <button class="btn sec" id="askNo">Cancelar</button>`, sh => {
        $('#askOk', sh).onclick = () => finish(input ? $('#askIn', sh).value : true);
        $('#askNo', sh).onclick = () => finish(input ? null : false);
        const i = $('#askIn', sh); if (i) i.onkeydown = e => { if (e.key === 'Enter') finish(i.value); };
      }, () => finish(input ? null : false));
  });
}
/* fields: [{k,label,type:'text'|'num'|'select'|'date'|'textarea', options, value, hint}] */
function formSheet(title, fields, onSave, onDelete){
  const f = fields.map(x => {
    const id = 'f_' + x.k;
    if (x.type === 'select') return `<label class="field"><span>${esc(x.label)}</span><select class="input" id="${id}">${x.options.map(o => { const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(v)===String(x.value)?'selected':''}>${esc(l)}</option>`; }).join('')}</select>${x.hint?`<small class="muted">${esc(x.hint)}</small>`:''}</label>`;
    if (x.type === 'textarea') return `<label class="field"><span>${esc(x.label)}</span><textarea class="input" id="${id}" style="height:90px;padding:12px">${esc(x.value ?? '')}</textarea></label>`;
    const type = x.type === 'num' ? 'text' : (x.type || 'text');
    const mode = x.type === 'num' ? 'inputmode="decimal"' : '';
    const val = x.type === 'num' && x.value != null && x.value !== '' ? String(x.value).replace('.', ',') : (x.value ?? '');
    return `<label class="field"><span>${esc(x.label)}</span><input class="input" id="${id}" type="${type}" ${mode} value="${esc(val)}" ${x.placeholder?`placeholder="${esc(x.placeholder)}"`:''}>${x.hint?`<small class="muted">${esc(x.hint)}</small>`:''}</label>`;
  }).join('');
  openSheet(`<div class="between"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>${f}
    <button class="btn" id="fSave">Guardar</button>${onDelete ? `<button class="btn danger" id="fDel">Apagar</button>` : ''}`, sh => {
      $('#fSave', sh).onclick = () => {
        const out = {};
        for (const x of fields){
          const el = $('#f_' + x.k, sh); let v = el.value;
          if (x.type === 'num'){ v = v.trim() === '' ? 0 : parseNum(v); if (isNaN(v)){ toast(`Valor inválido em “${x.label}”`); el.focus(); return; } }
          out[x.k] = v;
        }
        if (onSave(out) !== false){ save(); closeSheet(); render(); }
      };
      if (onDelete) $('#fDel', sh).onclick = async () => { if (await ask(`Apagar “${title}”?`, { ok:'Apagar', danger:true })){ onDelete(); save(); render(); } };
    });
}

/* ---------- Importar extrato do banco (tudo no telemóvel) ---------- */
async function unzipFile(buf){
  const dv = new DataView(buf); let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const n = dv.getUint16(e + 10, true); let off = dv.getUint32(e + 16, true); const files = {};
  const dec = new TextDecoder();
  for (let i = 0; i < n; i++){
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    files[dec.decode(new Uint8Array(buf, off + 46, nl))] = { method, csize, lho }; off += 46 + nl + el + cl;
  }
  return async name => {
    const f = files[name]; if (!f) return null;
    const nl = dv.getUint16(f.lho + 26, true), el = dv.getUint16(f.lho + 28, true);
    const data = new Uint8Array(buf, f.lho + 30 + nl + el, f.csize);
    if (f.method === 0) return dec.decode(data);
    const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(ds).text();
  };
}
async function readXlsx(buf){
  const get = await unzipFile(buf); const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const sst = await get('xl/sharedStrings.xml');
  const strings = sst ? [...xml(sst).getElementsByTagName('si')].map(si => si.textContent) : [];
  let sheet = null;
  for (let i = 1; i <= 5 && !sheet; i++) sheet = await get(`xl/worksheets/sheet${i}.xml`);
  if (!sheet) throw new Error('folha');
  const col = r => { const L = r.replace(/\d+/g, ''); let c = 0; for (const ch of L) c = c * 26 + ch.charCodeAt(0) - 64; return c - 1; };
  return [...xml(sheet).getElementsByTagName('row')].map(row => {
    const out = [];
    for (const c of row.getElementsByTagName('c')){
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0], is = c.getElementsByTagName('is')[0];
      let val = t === 's' ? strings[+v?.textContent] : t === 'inlineStr' ? is?.textContent : v ? v.textContent : '';
      if ((!t || t === 'n') && val !== '' && !isNaN(+val)) val = +val;
      out[col(c.getAttribute('r') || 'A1')] = val ?? '';
    }
    return [...out].map(x => x ?? '');
  });
}
function parseCSVText(text){
  const lines = text.split(/\r?\n/).slice(0, 40);
  const count = ch => lines.reduce((a, l) => a + (l.split(ch).length - 1), 0);
  const delim = [';', '\t', ','].sort((a, b) => count(b) - count(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"') q = true; else if (ch === delim){ row.push(cell); cell = ''; }
    else if (ch === '\n'){ row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function readStatement(file){
  const name = file.name.toLowerCase(); const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf.slice(0, 4));
  if (head[0] === 0x50 && head[1] === 0x4b) return readXlsx(buf);               // .xlsx (zip)
  if (head[0] === 0x25 && head[1] === 0x50) throw new Error('pdf');             // %PDF
  if (head[0] === 0xD0 && head[1] === 0xCF) throw new Error('xls-antigo');       // .xls binário antigo
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes(String.fromCharCode(0xFFFD))) text = new TextDecoder('windows-1252').decode(buf);
  if (/<table/i.test(text)){                                                     // "Excel" que é uma tabela HTML
    const doc = new DOMParser().parseFromString(text, 'text/html');
    return [...doc.querySelectorAll('tr')].map(tr => [...tr.querySelectorAll('th,td')].map(td => td.textContent.trim()));
  }
  return parseCSVText(text.replace(/^﻿/, ''));
}
function parseDateCell(v){
  if (typeof v === 'string' && /^\d{5}(\.\d+)?$/.test(v.trim())) v = +v;
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
  const s = String(v || '').trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){ const y = m[3].length === 2 ? 2000 + +m[3] : +m[3]; if (+m[2] > 12) return null; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  return null;
}
function parseAmountCell(v){
  if (typeof v === 'number') return v;
  let s = String(v || '').replace(/\s|€|EUR/gi, '').replace(/−/g, '-');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1, -1); }
  if (/-$/.test(s)){ neg = true; s = s.slice(0, -1); }
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isNaN(n) ? NaN : (neg ? -Math.abs(n) : n);
}
function detectColumns(rows){
  const N = c => norm(String(c));
  for (let i = 0; i < Math.min(rows.length, 40); i++){
    const r = rows[i].map(N);
    const find = (re, not) => r.findIndex(c => re.test(c) && !(not && not.test(c)));
    let date = find(/^data\s*(mov|movimento|operacao|lancamento|lanc|transacao)/);
    if (date < 0) date = find(/^data\b|^date/, /valor/);
    if (date < 0) date = find(/^data/);
    const desc = find(/descri|movimento|historico|designacao|detalhe|description|concept|operacao/, /^data/);
    const amount = find(/montante|^valor\b|importancia|amount|quantia/, /data|saldo/);
    const debit = find(/debito|^saida|levantamento/);
    const credit = find(/credito|^entrada|deposito/);
    if (date >= 0 && desc >= 0 && (amount >= 0 || debit >= 0 || credit >= 0)){
      const ex = re => r.findIndex(c => re.test(c));
      return { start: i + 1, date, desc, amount, debit, credit, saldo: ex(/^saldo/), tipo: ex(/^tipo$/), cat: ex(/^categoria$/), lig: ex(/^ligacao$/), mes: ex(/^mes$/), ret: ex(/^retencao/), share: ex(/^splitwise/) };
    }
  }

AFTER.importar = () => {

  const ig = $('#iniGo'); if (ig) ig.onclick = () => {
    const v = parseNum($('#iniSaldo').value); if (isNaN(v)){ toast('Indica o saldo nesse dia'); return; }

  };
  const hg = $('#histGo'); if (hg) hg.onclick = () => {
    for (const x of IMP.items){ if (x.antes){ x.antes = false; x.hist = true; x.on = !x.dup && x.kind !== 'interno' && x.kind !== 'ignorar'; } }
    rerender();
  };

    const el = e.target; const i = +el.dataset.i, f = el.dataset.f; if (isNaN(i) || !f) return;

      const d = { id:uid(), nome:out.nome.trim(), tipo:out.tipo, saldo:r2(out.saldo || 0), prestacao:r2(out.prestacao || 0), taeg:0, dia:0, nota:'' };
      S.debts.push(d);
      for (const y of IMP.items) if (y.kind === 'divida' && !S.debts.some(z => z.id === y.debtId) && norm(y.debtNome || '') === norm(x.debtNome || '')) y.debtId = d.id;
      x.debtId = d.id; setTimeout(done, 0);
    });
  } else {
    formSheet('Nova meta', [
      { k:'nome', label:'Nome', value:x.goalNome || '' },
      { k:'alvo', label:'Quanto queres juntar (opcional)', type:'num', value:'' },
      { k:'saldo', label:'Quanto tinha ANTES destes movimentos', type:'num', value:0 }
    ], out => {
      if (!out.nome.trim()){ toast('Indica o nome'); return false; }
      const g = { id:uid(), nome:out.nome.trim(), saldo:r2(out.saldo || 0), alvo:r2(out.alvo || 0), mensal:0, fase:1, pct:0, tipo:'propria' };
      S.goals.push(g);
      for (const y of IMP.items) if (y.kind === 'meta' && !S.goals.some(z => z.id === y.goalId) && norm(y.goalNome || '') === norm(x.goalNome || '')) y.goalId = g.id;
      x.goalId = g.id; setTimeout(done, 0);
    });
  }
}

/* ---------- Ecrã: Movimentos ---------- */
function vMovimentos(){

  const list = [...S.movs].sort((a,b) => b.data.localeCompare(a.data)).filter(m => !q || norm(`${m.desc} ${m.cat}`).includes(norm(q)));
  const groups = {};
  for (const m of list){ const k = m.data.slice(0,7); (groups[k] = groups[k] || []).push(m); }
  return `<main class="view">${backHeader('Movimentos','hoje')}
  <label class="btn sec" style="display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">${ic('doc',18)} Importar extrato do banco<input type="file" id="stmtIn" accept=".csv,.txt,.xlsx,.xls,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="sr"></label>
  <input class="input" id="mvQ" placeholder="Pesquisar" value="${esc(q)}" aria-label="Pesquisar movimentos">
  ${Object.keys(groups).length ? Object.entries(groups).map(([k, ms]) => { const [y,mm] = k.split('-').map(Number); return `<section class="card tight"><p class="lbl" style="padding-top:10px;text-transform:capitalize">${MESES[mm-1]} ${y}</p><div class="list">${ms.map(movRow).join('')}</div></section>`; }).join('') : '<p class="empty">Sem movimentos.</p>'}
  </main>`;
}
AFTER.movimentos = () => {

  const q = $('#mvQ'); let tm; q.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { routeArg = { q: q.value }; render(); const n = $('#mvQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
};

/* ---------- Ecrã: Mês ---------- */
function vMes(){
  const t = today(); const d = new Date(t.getFullYear(), t.getMonth() + mesOffset, 1); const mk = monthKey(d);
  const ms = movsMonth(mk).filter(m => m.tipo === 'despesa' && m.cat !== 'Impostos');
  const gasto = sum(ms, proprio);
  const fixas = sum(ms.filter(m => m.fixaId), proprio);
  const orc = sum(S.categories, c => c.orc || 0);
  const byCat = S.categories.map(c => ({ ...c, v: sum(ms.filter(m => m.cat === c.nome), proprio) })).filter(c => c.v > 0 || c.orc > 0);
  // média dos 6 meses anteriores por categoria (só meses com registos)
  const prevKeys = [...Array(6)].map((_, i) => monthKey(new Date(d.getFullYear(), d.getMonth() - 1 - i, 1)));
  const withData = prevKeys.filter(k => movsMonth(k).length);
  let insight = '';
  if (withData.length >= 2){
    let best = null;
    for (const c of byCat){
      const avg = sum(withData, k => sum(movsMonth(k).filter(m => m.tipo === 'despesa' && m.cat === c.nome), proprio)) / withData.length;
      if (avg > 20 && c.v > avg * 1.15){ const pct = Math.round((c.v / avg - 1) * 100); if (!best || pct > best.pct) best = { nome:c.nome, pct }; }
    }
    if (best) insight = `<p class="note blue">${esc(best.nome)} este mês está ${best.pct}% acima da tua média de ${withData.length} meses.</p>`;
  }
  const subs = S.fixas.filter(f => f.cat === 'Subscrições');
  const rec = monthIncome(mk); const base = S.settings.mesBase || 0;
  const excedente = r2(rec - base);
  return `<main class="view">
  <div class="between">
    <button class="iconbtn" id="mPrev" aria-label="Mês anterior" style="margin-left:-10px">${ic('chevl',22)}</button>
    <h1 style="font-size:20px;text-transform:capitalize">${MESES[d.getMonth()]} ${d.getFullYear()}</h1>
    <button class="iconbtn" id="mNext" aria-label="Mês seguinte" style="margin-right:-10px" ${mesOffset>=0?'disabled':''}>${ic('chev',22)}</button>
  </div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="between" style="align-items:flex-end"><div><p class="lbl">Gasto</p><p class="num big" style="margin:2px 0 0">${eur0(gasto)}</p></div><p class="small muted" style="margin:0 0 6px">orçamento ${eur0(orc)}</p></div>
    ${bar(orc ? gasto / orc * 100 : 0, gasto > orc ? '#B45309' : 'var(--ink)')}
    <div class="row small muted" style="gap:16px"><span><b style="color:var(--ink)">${eur0(fixas)}</b> fixas</span><span><b style="color:var(--ink)">${eur0(gasto - fixas)}</b> variáveis</span></div>
  </section>
  ${base ? `<section class="card"><div class="between"><div><p class="lbl">Recebido (sem IVA)</p><p class="num" style="font-size:22px;margin:2px 0 0">${eur0(rec)}</p></div><div style="text-align:right"><p class="lbl">Mês base</p><p class="num" style="font-size:22px;margin:2px 0 0">${eur0(base)}</p></div></div>
    <p class="small" style="margin:10px 0 0;${excedente>=0?'color:var(--teal)':'color:var(--amber)'};font-weight:600">${excedente >= 0 ? `+${eur0(excedente)} acima do mês base → podes passar para a Reserva de rendimento` : `Faltam ${eur0(-excedente)} para o mês base → podes tirar da Reserva de rendimento`}</p></section>` : ''}
  ${insight}
  <section class="card" style="display:flex;flex-direction:column;gap:13px" aria-label="Por categoria">
    <div class="between"><h2>Por categoria</h2><div class="row" style="gap:6px"><button class="btn sm sec" id="addCat">+ Categoria</button><button class="btn sm sec" id="editOrc">Orçamentos</button></div></div>
    ${byCat.length ? byCat.map(c => `<div style="display:flex;flex-direction:column;gap:6px"><div class="between" style="font-size:14px"><span style="font-weight:600">${esc(c.nome)}</span><span class="muted"><b style="color:var(--ink)">${eur0(c.v)}</b>${c.orc ? ` de ${eur0(c.orc)}` : ''}</span></div>${bar(c.orc ? c.v / c.orc * 100 : (c.v ? 100 : 0), c.orc && c.v > c.orc ? '#B45309' : '')}</div>`).join('') : '<p class="empty">Sem gastos neste mês.</p>'}
  </section>
  <section class="card"><div class="between"><div><p class="t15" style="margin:0">${subs.length} subscriç${subs.length===1?'ão':'ões'}</p><p class="small muted" style="margin:2px 0 0">despesas fixas da categoria Subscrições</p></div>
    <div style="text-align:right"><p class="t15" style="margin:0">${eur(sum(subs, f => f.valor))}/mês</p><p class="small muted" style="margin:2px 0 0">${eur0(sum(subs, f => f.valor) * 12)} por ano</p></div></div></section>
  <section class="card"><div class="between"><h2>Despesas fixas</h2><button class="btn sm sec" id="addFixa">+ Adicionar</button></div>
    <div class="list" style="margin-top:6px">${S.fixas.length ? [...S.fixas].sort((a,b)=>a.dia-b.dia).map(f => `<button class="item" data-fixa="${f.id}" style="width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;cursor:pointer;color:inherit"><div class="grow"><p class="t15">${esc(f.nome)}</p><p class="small muted">dia ${f.dia} · ${esc(f.cat)}${f.detalhe ? ' · ' + esc(f.detalhe) : ''}</p></div><p class="num" style="font-size:15px">${eur(f.valor)}</p></button>`).join('') : '<p class="empty">Ex.: conta conjunta, escola, Netflix…</p>'}</div></section>
  </main>`;
}
AFTER.mes = () => {
  $('#mPrev').onclick = () => { mesOffset--; render(); };
  $('#mNext').onclick = () => { if (mesOffset < 0){ mesOffset++; render(); } };
  $('#addFixa').onclick = () => fixaForm();
  document.querySelectorAll('[data-fixa]').forEach(b => b.onclick = () => fixaForm(S.fixas.find(f => f.id === b.dataset.fixa)));
  $('#addCat').onclick = () => formSheet('Nova categoria', [
    { k:'nome', label:'Nome', placeholder:'ex.: Ginásio' },
    { k:'orc', label:'Orçamento por mês', type:'num', value:0 },
    { k:'kw', label:'Palavras que a identificam (separadas por vírgulas)', placeholder:'ex.: ginasio, fitness hut' }
  ], out => {
    const nome = out.nome.trim(); if (!nome){ toast('Indica o nome'); return false; }
    if (S.categories.some(c => norm(c.nome) === norm(nome))){ toast('Já existe uma categoria com esse nome'); return false; }
    S.categories.splice(Math.max(0, S.categories.length - 1), 0, { nome, orc:r2(out.orc), kw: out.kw.split(',').map(x => x.trim()).filter(Boolean) });

  });
  $('#editOrc').onclick = () => formSheet('Orçamento mensal por categoria', S.categories.map((c, i) => ({ k:'c'+i, label:c.nome, type:'num', value:c.orc })), out => { S.categories.forEach((c, i) => c.orc = r2(out['c'+i])); });

function fixaForm(f){
  formSheet(f ? 'Editar despesa fixa' : 'Nova despesa fixa', [
    { k:'nome', label:'Nome', value:f?.nome || '', placeholder:'ex.: Conta conjunta (casa)' },
    { k:'valor', label:'Valor por mês', type:'num', value:f?.valor ?? '' },
    { k:'dia', label:'Dia do mês em que sai', type:'num', value:f?.dia ?? 1 },
    { k:'cat', label:'Categoria', type:'select', options:S.categories.map(c => c.nome), value:f?.cat || 'Casa (conta conjunta)' },
    { k:'detalhe', label:'Detalhe (opcional)', value:f?.detalhe || '', placeholder:'ex.: crédito habitação, luz, água' }
  ], out => {
    if (!out.nome.trim() || out.valor <= 0){ toast('Indica nome e valor'); return false; }
    const o = { nome:out.nome.trim(), valor:r2(out.valor), dia:Math.max(1, Math.min(31, Math.round(out.dia))), cat:out.cat, detalhe:out.detalhe.trim() };
    if (f) Object.assign(f, o); else S.fixas.push({ id:uid(), ...o });
  }, f ? () => { S.fixas = S.fixas.filter(x => x.id !== f.id); } : null);
}

/* ---------- Ecrã: Metas ---------- */
function vMetas(){
  const F = fase(); const sim = simulateDebts();
  const now = S.goals.filter(g => g.fase === 1); const fut = S.goals.filter(g => g.fase === 2);
  const avgSpend = (() => { const ks = [...Array(6)].map((_, i) => monthKey(new Date(today().getFullYear(), today().getMonth() - i, 1))).filter(k => movsMonth(k).length); return ks.length ? sum(ks, k => monthSpend(k)) / ks.length : 0; })();
  const goalCard = g => {
    const pct = g.alvo ? g.saldo / g.alvo * 100 : 0;
    const sub = g.tipo === 'emergencia' && avgSpend ? `${String(Math.round(g.saldo / avgSpend * 10) / 10).replace('.', ',')} meses de despesa` : g.tipo === 'reserva' ? 'enche nos meses acima do mês base' : (g.alvo ? `meta ${eur0(g.alvo)}` : 'sem meta definida');
    const mensal = goalMonthly(g);
    return `<button class="card" data-goal="${g.id}" style="display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:inherit;width:100%">
      <div class="between" style="width:100%"><p class="t15" style="margin:0">${esc(g.nome)}</p><p class="num" style="margin:0;font-size:15px">${eur0(g.saldo)}</p></div>
      <div style="width:100%">${bar(pct, g.tipo==='emergencia'?'#7C3AED':'')}</div>
      <div class="between small muted" style="width:100%"><span>${sub}</span><span>${mensal ? '+' + eur0(mensal) + '/mês' : (g.alvo ? (g.saldo >= g.alvo ? 'cheio ✓' : `faltam ${eur0(g.alvo - g.saldo)}`) : '')}</span></div></button>`;
  };
  return `<main class="view">
  <h1>Metas</h1>
  ${F === 1 ? `<section class="note blue" style="display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px">
    <b style="font-size:12px;letter-spacing:.4px">FASE 1 · DEVER MENOS</b>
    <span style="font-size:15px;font-weight:600">${sim.meses == null ? 'Define prestações nas dívidas para veres a data de fim' : `A dívida acaba em ${monthsToLabel(sim.meses)}`}</span>
    <span>Depois, ${eur0(S.settings.valorFuturo || 0)}/mês passam para as metas do futuro.</span></section>`
  : `<section class="note green" style="display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px"><b style="font-size:12px;letter-spacing:.4px">FASE 2 · CONSTRUIR</b><span style="font-size:15px;font-weight:600">Sem dívidas. ${eur0(S.settings.valorFuturo || 0)}/mês vão para o futuro, antes de gastares.</span></section>`}
  ${now.map(goalCard).join('')}
  <button class="btn ghost" id="addGoal">+ Nova meta</button>
  <section class="card" style="padding:12px 16px 4px">
    <div class="between"><p class="t15" style="margin:0">Depois das dívidas${F===1 ? ` · ${futureStartLabel()}` : ''}</p><button class="btn sm sec" id="editFut">Ajustar</button></div>
    <div class="list">${(() => { const em = fut.find(g => g.tipo === 'emergencia' && g.alvo > 0); const pc = fut.filter(g => g !== em && g.tipo !== 'emergencia');
      const lock = F===1 ? `<span class="muted">${ic('lock',18)}</span>` : '';
      const rowP = g => `<div class="item">${lock}<p class="grow t15">${esc(g.nome)}</p><p class="small muted">${g.pct}% · ${eur0(goalMonthly(g))}/mês${g.saldo ? ` · tens ${eur0(g.saldo)}` : ''}</p></div>`;
      if (!em) return pc.map(rowP).join('');
      const cheio = !emergEtapa() && F === 2;
      return `<p class="small muted" style="margin:6px 0 0">1.º passo</p><button class="item" data-goal="${em.id}" style="width:100%;background:none;border:none;text-align:left;color:inherit;cursor:pointer">${lock}<p class="grow t15">${esc(em.nome)}</p><p class="small muted">${cheio ? 'cheio ✓' : `até ${eur0(em.alvo)} · tens ${eur0(em.saldo || 0)}`}</p></button>
        <p class="small muted" style="margin:10px 0 0">2.º passo · quando o fundo estiver cheio</p>${pc.map(rowP).join('')}`; })()}</div>
  </section>
  <a href="#registar" id="toTransfer" class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Transferir para uma meta</a>
  <a href="#patrimonio" class="card between" style="text-decoration:none;color:inherit"><div><p class="t15" style="margin:0">Património líquido</p><p class="small muted" style="margin:2px 0 0">o que tens menos o que deves</p></div><div class="row" style="gap:6px"><span class="num" style="font-size:17px">${eur0(patrimonio().liquido)}</span>${ic('chev',20)}</div></a>
  <a href="#investimentos" class="card between" style="text-decoration:none;color:inherit"><div><p class="t15" style="margin:0">Investimentos</p><p class="small muted" style="margin:2px 0 0">ações e ETF · à parte das contas</p></div><div class="row" style="gap:6px"><span class="num" style="font-size:15px">${inv().ativos.length ? eur0(invResumo().valor) : ''}</span>${ic('chev',18)}</div></a>
  <a href="#dividas" class="card between" style="text-decoration:none;color:inherit"><div><p class="t15" style="margin:0">Dívidas</p><p class="small muted" style="margin:2px 0 0">${S.debts.filter(d=>d.saldo>0.005).length} em aberto</p></div><div class="row" style="gap:6px"><span class="num" style="font-size:17px;color:var(--amber)">${eur0(sum(S.debts.filter(d=>d.saldo>0), d => d.saldo))}</span>${ic('chev',20)}</div></a>
  </main>`;
}
AFTER.metas = () => {
  $('#toTransfer').onclick = e => { e.preventDefault(); go('registar', { tipo:'transferencia' }); };
  document.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => {
    const g = S.goals.find(x => x.id === b.dataset.goal);
    formSheet(g.nome, [
      { k:'nome', label:'Nome', value:g.nome },
      { k:'saldo', label:'Quanto tens hoje', type:'num', value:g.saldo },
      { k:'alvo', label:'Meta (valor a atingir)', type:'num', value:g.alvo, hint: g.tipo==='emergencia' ? 'Sugestão: 3 a 6 meses de despesa' : g.tipo==='reserva' ? 'Sugestão: 1 a 2 vezes o mês base' : '' },
      ...(g.tipo === 'emergencia' ? [{ k:'fase', label:'Quando', type:'select', value:String(g.fase), options:[['2','Depois das dívidas (antes dos PPR e investimentos)'],['1','Já, ao mesmo tempo que pago as dívidas']] }] : []),
      ...(g.fase === 2 && g.tipo !== 'emergencia' ? [] : [{ k:'mensal', label:'Pôr por mês (sai antes do Livre para gastar)', type:'num', value:g.mensal, hint: g.tipo === 'emergencia' ? 'Só conta se escolheres “Já”. Depois das dívidas, recebe o valor do futuro.' : '' }])
    ], out => { Object.assign(g, { nome:out.nome.trim() || g.nome, saldo:r2(out.saldo), alvo:r2(out.alvo) }); if (out.mensal !== undefined) g.mensal = r2(out.mensal); if (out.fase) g.fase = +out.fase; if (g.fase === 2) g.mensal = 0; },
    g.tipo === 'propria' ? () => { S.goals = S.goals.filter(x => x.id !== g.id); } : null);
  });
  $('#addGoal').onclick = () => formSheet('Nova meta', [
    { k:'nome', label:'Nome', placeholder:'ex.: Fundo do Manel' },
    { k:'alvo', label:'Valor a atingir', type:'num', value:'' },
    { k:'saldo', label:'Quanto já tens', type:'num', value:0 },
    { k:'mensal', label:'Pôr por mês (sai antes do Livre para gastar)', type:'num', value:0 }
  ], out => {
    const nome = out.nome.trim(); if (!nome){ toast('Indica o nome'); return false; }
    S.goals.splice(S.goals.filter(g => g.fase === 1).length, 0, { id:'g_' + uid(), nome, saldo:r2(out.saldo), alvo:r2(out.alvo), mensal:r2(out.mensal), fase:1, pct:0, tipo:'propria' });
    toast(`Meta “${nome}” criada`);
  });
  $('#editFut').onclick = () => {
    const fut = S.goals.filter(g => g.fase === 2 && g.tipo !== 'emergencia');
    formSheet('Metas do futuro', [
      { k:'valor', label:'Valor por mês para o futuro', type:'num', value:S.settings.valorFuturo, hint:'Começa automaticamente quando a última dívida acabar. Se o fundo de emergência estiver em “depois das dívidas”, este valor vai primeiro todo para ele até chegar à meta.' },
      ...fut.map(g => ({ k:g.id, label:`${g.nome} (%)`, type:'num', value:g.pct })),
      ...fut.map(g => ({ k:'s_'+g.id, label:`${g.nome} · quanto tens hoje`, type:'num', value:g.saldo }))
    ], out => {
      const tot = sum(fut, g => out[g.id]);
      if (Math.abs(tot - 100) > 0.5){ toast(`As percentagens somam ${Math.round(tot)}%, têm de somar 100%`); return false; }
      S.settings.valorFuturo = r2(out.valor); fut.forEach(g => { g.pct = r2(out[g.id]); g.saldo = r2(out['s_'+g.id]); });
    });
  };
};

/* ---------- Ecrã: Património ---------- */
function patrimonio(){
  const conta = saldoConta();
  const fundos = sum(S.goals, g => g.saldo || 0);
  const acoes = invResumo().valor;   // mostrado à parte, NÃO soma ao património
  const aReceber = sum(S.debts.filter(d => d.saldo < 0), d => -d.saldo);
  const deve = sum(S.debts.filter(d => d.saldo > 0), d => d.saldo);
  const tem = conta + fundos + aReceber;
  return { conta, fundos, acoes, aReceber, tem, deve, liquido: r2(tem - deve) };
}
function vPatrimonio(){
  const P = patrimonio();
  const byType = t => sum(S.debts.filter(d => d.saldo > 0 && t.includes(d.tipo)), d => d.saldo);
  const row = (a, b) => `<div class="between" style="font-size:14px;padding:4px 0"><span class="muted">${a}</span><b>${b}</b></div>`;
  return `<main class="view">${backHeader('Património','metas')}
  <section class="card"><p class="lbl">Património líquido</p><p class="num" style="font-size:40px;margin:2px 0 0">${eur0(P.liquido)}</p></section>
  <div class="grid2">
    <section class="card" style="padding:14px"><p class="lbl">Tens</p><p class="num" style="font-size:22px;margin:2px 0 8px">${eur0(P.tem)}</p>${row('Conta', eur0(P.conta))}${row('Metas e fundos', eur0(P.fundos))}${P.aReceber ? row('A receber', eur0(P.aReceber)) : ''}</section>
    <section class="card" style="padding:14px"><p class="lbl">Deves</p><p class="num" style="font-size:22px;margin:2px 0 8px;color:var(--amber)">${eur0(P.deve)}</p>${row('Estado', eur0(byType(['estado'])))}${row('Cartão', eur0(byType(['cartao'])))}${row('Créditos', eur0(byType(['credito','habitacao','automovel'])))}${row('Pessoas', eur0(byType(['splitwise','pessoal'])))}</section>
  </div>
  <a href="#investimentos" class="card between" style="text-decoration:none;color:inherit"><div><p class="t15" style="margin:0">Investimentos · à parte</p><p class="small muted" style="margin:2px 0 0">não somam ao património nem ao Livre</p></div><div class="row" style="gap:6px"><span class="num" style="font-size:15px">${eur0(P.acoes)}</span>${ic('chev',18)}</div></a>
  <a href="#dividas" class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Ver dívidas</a>

/* ---------- Investimentos (1.5) ----------
   Ficam FORA do Livre para gastar e do património líquido. As operações vivem na corretora:
   não mexem no saldo da conta (o dinheiro enviado para a corretora regista-se no banco). */
const INV_PAISES = { US:['Estados Unidos',840], IE:['Irlanda',372], LU:['Luxemburgo',442], DE:['Alemanha',276], FR:['França',250], NL:['Países Baixos',528], GB:['Reino Unido',826], ES:['Espanha',724], IT:['Itália',380], CH:['Suíça',756], BE:['Bélgica',56], DK:['Dinamarca',208], SE:['Suécia',752], FI:['Finlândia',246], CA:['Canadá',124], JP:['Japão',392], PT:['Portugal',620] };
const invPais = isin => { const k = String(isin || '').slice(0, 2).toUpperCase(); return INV_PAISES[k] ? { cod:k, nome:INV_PAISES[k][0], num:INV_PAISES[k][1] } : (k ? { cod:k, nome:k, num:'' } : null); };
const inv = () => (S.inv = S.inv || { corretoras:['DEGIRO','Trade Republic'], ativos:[], ops:[] });
const r4 = n => Math.round((+n || 0) * 10000) / 10000;
const numFlex = s => { s = String(s ?? '').replace(/[\s€$"]/g, ''); if (!s) return NaN; const c = s.lastIndexOf(','), d = s.lastIndexOf('.');
  if (c > -1 && d > -1) s = c > d ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); else if (c > -1) s = s.replace(',', '.'); return parseFloat(s); };
function invOrdered(ativoId){
  return inv().ops.map((o, i) => ({ o, i })).filter(x => x.o.ativoId === ativoId && x.o.tipo !== 'dividendo')
    .sort((a, b) => a.o.data.localeCompare(b.o.data) || (a.o.tipo === b.o.tipo ? a.i - b.i : a.o.tipo === 'compra' ? -1 : 1)).map(x => x.o);
}
// FIFO por lotes (regra do CIRS): cada venda consome primeiro as unidades mais antigas
function invCalc(ativoId){
  const lots = []; const linhas = []; const erros = [];
  for (const o of invOrdered(ativoId)){
    if (o.tipo === 'compra'){ lots.push({ data:o.data, qtd:+o.qtd, preco:+o.preco, comUnit: o.qtd ? (+o.comissao || 0) / o.qtd : 0, opId:o.id }); continue; }
    let falta = +o.qtd; const comVendaUnit = o.qtd ? (+o.comissao || 0) / o.qtd : 0;
    while (falta > 1e-9 && lots.length){
      const L = lots[0]; const q = Math.min(L.qtd, falta);
      const valorReal = r2(q * o.preco), valorAq = r2(q * L.preco), despesas = r2(q * (L.comUnit + comVendaUnit));
      linhas.push({ ativoId, opId:o.id, dataReal:o.data, dataAq:L.data, qtd:r4(q), valorReal, valorAq, despesas, ganho:r2(valorReal - valorAq - despesas) });
      L.qtd = r4(L.qtd - q); falta = r4(falta - q); if (L.qtd <= 1e-9) lots.shift();
    }
    if (falta > 1e-9) erros.push({ opId:o.id, falta });
  }
  const qtd = r4(lots.reduce((a, l) => a + l.qtd, 0));
  const custo = r2(lots.reduce((a, l) => a + l.qtd * (l.preco + l.comUnit), 0));
  return { lots, linhas, erros, qtd, custo, pm: qtd > 0 ? custo / qtd : 0 };
}
function invResumo(){
  const I = inv(); let investido = 0, valor = 0, semPreco = 0;
  const pos = I.ativos.map(a => { const c = invCalc(a.id); const v = c.qtd > 0 ? (a.preco ? r2(c.qtd * a.preco) : c.custo) : 0;
    if (c.qtd > 0){ investido += c.custo; valor += v; if (!a.preco) semPreco++; } return { a, c, valor:v, dif:r2(v - c.custo) }; });
  return { pos, investido:r2(investido), valor:r2(valor), dif:r2(valor - investido), semPreco };
}
function invAno(ano){
  const y = String(ano); const linhas = []; const I = inv();
  for (const a of I.ativos) for (const l of invCalc(a.id).linhas) if (l.dataReal.startsWith(y)) linhas.push({ ...l, ativo:a });
  linhas.sort((p, q) => p.dataReal.localeCompare(q.dataReal));
  const divs = I.ops.filter(o => o.tipo === 'dividendo' && o.data.startsWith(y)).map(o => ({ ...o, ativo: I.ativos.find(a => a.id === o.ativoId) }));

// Importação do CSV de transações da DEGIRO (PT ou EN)
function invImportDegiro(text){
  const rows = parseCSVText(text.replace(/^﻿/, '')).filter(r => r.some(c => String(c).trim()));
  const hi = rows.findIndex(r => { const n = r.map(norm); return n.includes('isin') && n.some(c => /^(produto|product)$/.test(c)); });
  if (hi < 0) return { erro:'Não reconheço este ficheiro. Na DEGIRO: Atividade → Transações → Exportar CSV.' };
  const H = rows[hi].map(c => norm(c).trim());
  const col = (...re) => H.findIndex(h => re.some(r => r.test(h)));
  const cData = col(/^(data|date)$/), cHora = col(/^(hora|time)$/), cProd = col(/^(produto|product)$/), cIsin = col(/^isin$/), cQtd = col(/^(quantidade|quantity)$/), cPreco = col(/^(precos?|price)$/);
  const cValor = col(/^(valor|value)$/), cCusto = col(/custos|fees|comiss/), cOrd = col(/^(id da ordem|order id|order)$/);
  if ([cData, cProd, cIsin, cQtd].some(x => x < 0)) return { erro:'Faltam colunas (Data, Produto, ISIN, Quantidade).' };
  const I = inv(); if (!I.corretoras.includes('DEGIRO')) I.corretoras.unshift('DEGIRO');
  const items = [];
  for (const r of rows.slice(hi + 1)){
    const qtd = numFlex(r[cQtd]); if (!qtd || isNaN(qtd)) continue;
    const ds = String(r[cData] || '').trim(); const m = ds.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/) || ds.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) continue;
    const data = m[1].length === 4 ? `${m[1]}-${m[2]}-${m[3]}` : `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const valorEur = cValor >= 0 ? Math.abs(numFlex(r[cValor])) : NaN; const precoLocal = cPreco >= 0 ? numFlex(r[cPreco]) : NaN;
    const preco = valorEur > 0 ? valorEur / Math.abs(qtd) : precoLocal;
    if (!(preco > 0)) continue;
    items.push({ data, hora: cHora >= 0 ? String(r[cHora]).trim() : '', nome:String(r[cProd]).trim(), isin:String(r[cIsin]).trim().toUpperCase(), qtd:Math.abs(qtd), tipo: qtd > 0 ? 'compra' : 'venda', preco, comissao: cCusto >= 0 ? Math.abs(numFlex(r[cCusto])) || 0 : 0, ord: cOrd >= 0 ? String(r[cOrd]).trim() : '' });
  }
  if (!items.length) return { erro:'Não encontrei transações neste ficheiro.' };
  items.sort((a, b) => a.data.localeCompare(b.data) || a.hora.localeCompare(b.hora) || (a.tipo === b.tipo ? 0 : a.tipo === 'compra' ? -1 : 1));
  let novas = 0, dup = 0;
  for (const it of items){
    const key = `degiro|${it.data}|${it.hora}|${it.isin}|${it.tipo}|${r4(it.qtd)}|${r2(it.preco * it.qtd)}|${it.ord}`;
    if (I.ops.some(o => o.importKey === key)){ dup++; continue; }
    let a = I.ativos.find(x => x.corretora === 'DEGIRO' && x.isin && x.isin === it.isin) || I.ativos.find(x => x.corretora === 'DEGIRO' && norm(x.nome) === norm(it.nome));
    if (!a){ a = { id:uid(), nome:it.nome, isin:it.isin, corretora:'DEGIRO', preco:0, precoData:'' }; I.ativos.push(a); }
    I.ops.push({ id:uid(), data:it.data, tipo:it.tipo, ativoId:a.id, qtd:r4(it.qtd), preco:r4(it.preco), comissao:r2(it.comissao), importKey:key });
    if (it.tipo === 'compra' && (!a.preco || it.data >= (a.precoData || ''))){ a.preco = r4(it.preco); a.precoData = it.data; }
    novas++;
  }
  return { novas, dup };
}

/* Diagnóstico para o Claude: ficheiro legível (não encriptado) que o João decide enviar */
function buildDiagnostic(anon, meses){
  const t = today(); const desde = meses ? iso(new Date(t.getFullYear(), t.getMonth() - meses + 1, 1)) : '0000-00-00';
  const clone = x => JSON.parse(JSON.stringify(x));
  const movs = clone(S.movs.filter(m => m.data >= desde)).map(m => {
    if (anon){ m.desc = m.tipo === 'despesa' ? (m.fixaId ? (S.fixas.find(f => f.id === m.fixaId)?.nome || m.cat) : m.cat) : m.tipo === 'receita' ? (m.cat === 'Outras entradas' ? 'Entrada' : 'Recibo') : m.desc; delete m.importKey; }
    return m;
  });
  const mk = monthKey(t), L = livre();
  return {
    app:'pura-vida-diagnostico', versao:APP_VERSION, gerado:new Date().toISOString(), hoje:iso(t), anonimizado:!!anon, meses: meses || 'todos',
    resumo:{ livre:L, porque:{
      impostos:taxBreakdown(),
      fixasPorPagar:fixasPendentes(mk).map(f => ({ nome:f.nome, valor:f.valor })),
      dividasDoMes:debtPlanPending(mk), reforco:S.settings.reforcoDivida, fase:fase(), fimDividas:payoffMonth(),
      metasDoMes:S.goals.map(g => ({ nome:g.nome, mensal:goalMonthly(g), jaPosto:goalTransfersMonth(g.id, mk) })).filter(g => g.mensal),
      simulacaoDividas:simulateDebts(), faltaReserva:shortfall(L)
    }, mesAtual:{ gasto:monthSpend(mk), recebido:monthIncome(mk) }, totalMovimentos:S.movs.length },
    dados:{ v:S.v, criado:S.criado, onboarded:S.onboarded, settings:{ ...clone(S.settings), regrasUrl: S.settings.regrasUrl ? '(definido)' : '' },
      rules:clone(S.rules), categories:clone(S.categories), fixas:clone(S.fixas), debts:clone(S.debts), goals:clone(S.goals), marcas:clone(S.marcas || {}),
      importRules: anon ? {} : clone(S.importRules || {}), movs }
  };
}

/* Cópia de segurança: no iPhone abre a folha de partilha → "Guardar em Ficheiros" → iCloud Drive */
async function exportBackup(){
  if (!VAULT) return;
  await saveNow();
  const name = `pura-vida-copia-${iso(today())}.json`;
  const content = JSON.stringify({ app:'pura-vida', ...VAULT });
  let ok = false;
  try {
    const file = new File([content], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Cópia Pura Vida' }); ok = true;
    }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  if (!ok){ download(name, content, 'application/json'); ok = true; }
  S.settings.ultimaCopia = iso(today()); save();
  toast('Cópia feita. Guarda-a no iCloud Drive (Ficheiros).');
  render();
}
function backupDue(){
  if (!S || !S.movs.length) return false;
  const last = S.settings.ultimaCopia; if (!last) return true;
  return (today() - new Date(last + 'T00:00:00')) / 86400000 >= 7;
}
async function updateRulesFlow(){
  const url = await ask('Endereço do ficheiro de regras (JSON). Fica guardado para os próximos anos.', { input:'url', ok:'Atualizar', value:S.settings.regrasUrl || '', placeholder:'https://…/regras.json' });
  if (!url) return;
  try {
    const res = await fetch(url, { cache:'no-store' }); if (!res.ok) throw new Error(res.status);
    const nr = await res.json();
    const ok = nr && typeof nr.ano === 'number' && nr.ivaTaxa > 0 && nr.ivaTaxa < 1 && nr.ssTaxa > 0 && nr.ssTaxa < 1 && nr.ssCoeficiente > 0 && nr.ssCoeficiente <= 1 && Array.isArray(nr.prazos) && nr.prazos.every(p => p.nome && p.mes >= 1 && p.mes <= 12);
    if (!ok) throw new Error('formato');
    const ch = [];
    if (nr.ano !== S.rules.ano) ch.push(`Ano: ${S.rules.ano} → ${nr.ano}`);
    if (nr.ivaTaxa !== S.rules.ivaTaxa) ch.push(`IVA: ${S.rules.ivaTaxa*100}% → ${nr.ivaTaxa*100}%`);
    if (nr.ssTaxa !== S.rules.ssTaxa) ch.push(`SS: ${S.rules.ssTaxa*100}% → ${nr.ssTaxa*100}%`);
    if (nr.ssCoeficiente !== S.rules.ssCoeficiente) ch.push(`Coeficiente SS: ${S.rules.ssCoeficiente*100}% → ${nr.ssCoeficiente*100}%`);
    if (JSON.stringify(nr.prazos) !== JSON.stringify(S.rules.prazos)) ch.push(`Prazos: ${nr.prazos.length} datas atualizadas`);
    if (!ch.length){ toast('As regras já estão atualizadas'); S.settings.regrasUrl = url; save(); return; }
    if (!await ask('Mudanças nas regras:\n\n' + ch.join('\n'), { ok:'Aceitar mudanças' })) return;
    S.rules = { ...DEFAULT_RULES, ...nr }; S.settings.regrasUrl = url; save(); toast('Regras atualizadas'); render();
  } catch(e){ toast('Não consegui atualizar. A app continua com as regras atuais.'); }
}
function download(name, content, type){
  const blob = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function migrate(){ if (!S.v) S.v = 1; if (S.onboarded === undefined) S.onboarded = true;
  for (const dc of DEFAULT_CATEGORIES){ const c = S.categories.find(x => x.nome === dc.nome); if (c){ c.kw = c.kw || []; for (const k of dc.kw) if (!c.kw.includes(k)) c.kw.push(k); } }
  S.importRules = S.importRules || {}; S.marcas = S.marcas || {}; S.reservasAntigas = S.reservasAntigas || [];
  if (!S.inv){ S.inv = { corretoras:['DEGIRO','Trade Republic'], ativos:[], ops:[] }; const v = S.settings.investimentosValor || 0;
    if (v > 0){ const a = { id:uid(), nome:'Carteira (sem detalhe)', isin:'', corretora:'DEGIRO', preco:r4(v), precoData:iso(today()) }; S.inv.ativos.push(a); S.inv.ops.push({ id:uid(), data:iso(today()), tipo:'compra', ativoId:a.id, qtd:1, preco:r4(v), comissao:0 }); } }
  if (!S.goals.some(g => g.id === 'ppr_joao')) S.goals.push({ id:'ppr_joao', nome:'PPR do João', saldo:0, alvo:0, mensal:0, fase:2, pct:0, tipo:'futuro' });
  if (!S.mig142){ S.mig142 = true; const e = S.goals.find(g => g.tipo === 'emergencia'); if (e && e.fase === 1 && !(e.mensal > 0)) { e.fase = 2; e.mensal = 0; } }
  S.settings = { ...freshState().settings, ...S.settings };
  // categorias novas (entram a seguir à categoria indicada)
  const addCat = (nome, after) => { if (S.categories.some(c => c.nome === nome)) return; const i = S.categories.findIndex(c => c.nome === after);
    S.categories.splice(i >= 0 ? i + 1 : Math.max(0, S.categories.length - 1), 0, JSON.parse(JSON.stringify(DEFAULT_CATEGORIES.find(c => c.nome === nome)))); };
  addCat('Entregas (Uber Eats, Glovo)', 'Comer fora');
  const cf = S.categories.find(c => c.nome === 'Comer fora'); if (cf) cf.kw = cf.kw.filter(k => !['uber eats','glovo','bolt food','take'].includes(k));
  addCat('Roupa e calçado', 'Bem-estar');
}
