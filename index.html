<script>
'use strict';
/* =========================================================
   Pura Vida — app de finanças pessoais
   Tudo corre no telemóvel. Dados encriptados (AES-GCM) com
   chave derivada da palavra-passe (PBKDF2). Sem servidores.
   ========================================================= */
const APP_VERSION = '1.3.1';
const STORE_KEY = 'vt_vault_v1';
const LOCK_AFTER_MS = 2 * 60 * 1000;

/* ---------- Regras fiscais (editáveis em Definições) ---------- */
const DEFAULT_RULES = {

  },

const DEFAULT_CATEGORIES = [
  { nome:'Casa (conta conjunta)', orc:500, kw:['conta conjunta','casa','luz','agua','água','gas','gás','renda','condominio','condomínio'] },

  { nome:'Comer fora', orc:100, kw:['restaurante','jantar','almoço','almoco','cafe','café','take','pizza','sushi','bar','pastelaria'] },
  { nome:'Subscrições', orc:40, kw:['netflix','spotify','icloud','youtube','disney','hbo','prime','chatgpt','claude','apple'] },
  { nome:'Lazer', orc:60, kw:['cinema','climbup','escalada','surf','concerto','livro','jogo','ginasio','ginásio'] },
  { nome:'Saúde', orc:40, kw:['farmacia','farmácia','medico','médico','dentista','analises','análises','consulta','fisio'] },
  { nome:'Bem-estar', orc:30, kw:['cabeleireiro','barbeiro','wells','massagem'] },
  { nome:'Manel', orc:300, kw:['manel','escola','creche','brinquedo','fraldas'] },
  { nome:'Atividade profissional', orc:50, kw:['material','seguro acidentes','contabilista','formação','formacao','equipamento'] },
  { nome:'Impostos', orc:0, kw:['iva','seguranca social','segurança social','irs','finanças','financas','coima'] },
  { nome:'Viagens', orc:0, kw:['viagem','hotel','airbnb','voo','ryanair','tap'] },

/* ---------- Utilitários ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('pt-PT', { style:'currency', currency:'EUR' });
const fmt0 = new Intl.NumberFormat('pt-PT', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const eur = v => fmt.format(Math.round((v||0)*100)/100);
const eur0 = v => fmt0.format(Math.round(v||0));
const r2 = v => Math.round((v||0)*100)/100;
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const parseNum = s => { if (s === '' || s == null) return NaN; return parseFloat(String(s).replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); };
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const lastDay = (y,m) => new Date(y, m, 0).getDate(); // m 1-12
const daysLeftInMonth = () => { const t = today(); return lastDay(t.getFullYear(), t.getMonth()+1) - t.getDate() + 1; };
const shortDate = isoStr => { const [y,m,d] = isoStr.split('-').map(Number); return `${d} ${MES3[m-1]}`; };

const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevl:'<path d="M15 6l-6 6 6 6"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  up:'<path d="M7 14l5-5 5 5"/>',
  check:'<path d="M5 12l5 5L20 7"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'

const ic = (n, size=22, sw=1.8) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- Encriptação ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv:b64(iv), ct:b64(ct) };
}
async function decryptJSON(key, box){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(box.iv) }, key, unb64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* Chave dos dados (aleatória) guardada duas vezes: com a palavra-passe e com o código de recuperação */
const RC_ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const rand16 = () => crypto.getRandomValues(new Uint8Array(16));
function newRecoveryCode(){
  let out = '';
  while (out.length < 24){ for (const x of crypto.getRandomValues(new Uint8Array(32))){ if (x < 248 && out.length < 24) out += RC_ALPHA[x % 31]; } }
  return out.match(/.{4}/g).join('-');
}
const normCode = c => String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
async function encBytes(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, bytes); return { iv:b64(iv), ct:b64(ct) }; }
async function decBytes(key, box){ return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(box.iv) }, key, unb64(box.ct))); }
const importDEK = raw => crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
async function newVaultKeys(pass){
  const raw = crypto.getRandomValues(new Uint8Array(32)); const iter = 310000;
  const saltP = rand16(), saltR = rand16(); const code = newRecoveryCode();
  const wrapP = await encBytes(await deriveKey(pass, saltP, iter), raw);
  const wrapR = await encBytes(await deriveKey(normCode(code), saltR, iter), raw);
  DEK_RAW = raw; KEY = await importDEK(raw);
  return { fields:{ v:2, iter, saltP:b64(saltP), wrapP, saltR:b64(saltR), wrapR }, code };
}
async function openWithPass(vault, pass){
  if (vault.v === 2){
    const raw = await decBytes(await deriveKey(pass, unb64(vault.saltP), vault.iter), vault.wrapP);
    const key = await importDEK(raw);
    return { key, raw, data: vault.ct ? await decryptJSON(key, vault) : null };
  }
  const key = await deriveKey(pass, unb64(vault.salt), vault.iter);
  return { key, raw:null, data: await decryptJSON(key, vault), legacy:true };
}
async function openWithCode(vault, code){
  if (vault.v !== 2) throw new Error('sem código');
  const raw = await decBytes(await deriveKey(normCode(code), unb64(vault.saltR), vault.iter), vault.wrapR);
  const key = await importDEK(raw);
  return { key, raw, data: vault.ct ? await decryptJSON(key, vault) : null };
}
async function rewrapPass(pass){
  const saltP = rand16();
  VAULT = { ...VAULT, saltP:b64(saltP), wrapP: await encBytes(await deriveKey(pass, saltP, VAULT.iter), DEK_RAW) };
}
async function newCodeForVault(){
  const code = newRecoveryCode(); const saltR = rand16();
  VAULT = { ...VAULT, saltR:b64(saltR), wrapR: await encBytes(await deriveKey(normCode(code), saltR, VAULT.iter), DEK_RAW) };
  return code;
}

/* ---------- Estado ---------- */
let S = null;          // dados desencriptados (só em memória)
let KEY = null;        // chave AES dos dados
let DEK_RAW = null;    // a mesma chave em bruto (só em memória), para a voltar a guardar
let VAULT = null;      // { salt, iter, iv, ct }
let saveTimer = null;
let hiddenAt = 0;

/* Armazenamento: IndexedDB (sem limite prático); localStorage só como recurso */
const IDB_NAME = 'vida-tranquila', IDB_STORE = 'kv'; // nome interno antigo: não mudar (é onde estão os dados)
let idbP = null;
function idb(){
  if (!idbP) idbP = new Promise((res, rej) => {
    if (!('indexedDB' in window)) { rej(new Error('sem IndexedDB')); return; }
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return idbP;
}
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const t = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); }
async function idbSet(k, v){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); }); }
async function idbDel(k){ const db = await idb(); return new Promise(res => { const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).delete(k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); }
const lsGet = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch(e){ return null; } };
async function readVault(){
  try {
    let v = await idbGet('vault');
    if (!v){ const old = lsGet(); if (old){ await idbSet('vault', old); v = old; try { localStorage.removeItem(STORE_KEY); } catch(e){} } }
    return v || null;
  } catch(e){ return lsGet(); }
}
let writeQ = Promise.resolve();
function writeVault(v){
  const copy = JSON.parse(JSON.stringify(v));
  writeQ = writeQ.then(() => idbSet('vault', copy)).catch(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(copy)); } catch(e){ toast('Não foi possível guardar neste dispositivo.'); }
  });
  return writeQ;
}
async function wipeVault(){ try { await idbDel('vault'); } catch(e){} try { localStorage.removeItem(STORE_KEY); } catch(e){} }

function addReceita(s, { data, desc, base, comIva, cat }){
  const r = s.rules;
  const iva = comIva ? r2(base * r.ivaTaxa) : 0;
  const ss = r2(base * r.ssCoeficiente * r.ssTaxa);
  const irs = r2(base * (s.settings.irsPct || 0) / 100);
  const mov = { id:uid(), data, tipo:'receita', valor:r2(base + iva), base:r2(base), iva, comIva:!!comIva, cat: cat || 'Recibos verdes', desc, reservas:{ iva, ss, irs } };
  s.movs.push(mov);
  return mov;
}

/* ---------- Cálculos ---------- */
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const movsMonth = mk => S.movs.filter(m => m.data.slice(0,7) === mk);

function saldoConta(){
  let s = S.settings.saldoInicial || 0;
  for (const m of S.movs){
    if (m.tipo === 'receita') s += m.valor;
    else s -= m.valor;
  }
  return r2(s);
}
function taxReserve(){
  // o que está reservado para impostos = IVA + SS + IRS ainda por pagar (cada um nunca abaixo de zero)
  const t = taxBreakdown(); return r2(t.iva + t.ss + t.irs);
}
function taxBreakdown(){
  const rec = S.movs.filter(m => m.tipo === 'receita');
  const pagos = S.movs.filter(m => m.tipo === 'despesa' && m.cat === 'Impostos');
  const tag = k => sum(pagos.filter(p => p.impTipo === k), p => p.valor);
  const iva = sum(rec, m => m.reservas?.iva||0) - tag('iva');
  const ss = sum(rec, m => m.reservas?.ss||0) - tag('ss');
  const irs = sum(rec, m => m.reservas?.irs||0) - tag('irs'); // coimas e outros (sem tipo) não mexem nas reservas
  return { iva:r2(Math.max(0,iva)), ss:r2(Math.max(0,ss)), irs:r2(Math.max(0,irs)) };
}
function fixaPaidThisMonth(f, mk){ return S.movs.some(m => m.fixaId === f.id && m.data.slice(0,7) === mk); }
function fixasPendentes(mk = monthKey(today())){ return S.fixas.filter(f => !fixaPaidThisMonth(f, mk)); }
function activeDebts(){ return S.debts.filter(d => d.saldo > 0.005 && d.tipo !== 'splitwise'); }
function fase(){ return activeDebts().length ? 1 : 2; }
function debtPlanPending(mk = monthKey(today())){
  // plano do mês = prestações das dívidas que existiam no início do mês + reforço;
  // por pagar = plano − já pago este mês, nunca mais do que ainda se deve
  const ms = movsMonth(mk);
  const deb = S.debts.filter(d => d.tipo !== 'splitwise');
  const paidOf = d => sum(ms.filter(m => m.tipo === 'divida' && m.dividaId === d.id), m => m.valor);
  const atStart = deb.filter(d => d.saldo + paidOf(d) > 0.005);
  if (!atStart.length) return 0;
  const plano = sum(atStart, d => Math.min(d.prestacao || 0, d.saldo + paidOf(d))) + (S.settings.reforcoDivida || 0);
  const pago = sum(atStart, paidOf);
  const emDivida = sum(deb.filter(d => d.saldo > 0), d => d.saldo);
  return r2(Math.max(0, Math.min(plano - pago, emDivida)));
}
function payoffMonth(){
  // mês do último pagamento de dívida (quando já não há dívidas): as metas do futuro começam no mês seguinte
  if (fase() !== 2) return null;
  const ids = new Set(S.debts.filter(d => d.tipo !== 'splitwise').map(d => d.id));
  const ks = S.movs.filter(m => m.tipo === 'divida' && ids.has(m.dividaId)).map(m => m.data.slice(0,7)).sort();
  return ks.length ? ks[ks.length-1] : null;
}
function goalTransfersMonth(goalId, mk){ return sum(movsMonth(mk).filter(m => m.tipo === 'transferencia' && m.metaId === goalId), m => m.valor); }
function goalMonthly(g){
  if (g.fase === 2){
    if (fase() !== 2) return 0;
    const pm = payoffMonth(); if (pm && monthKey(today()) <= pm) return 0;
    return r2((S.settings.valorFuturo || 0) * (g.pct || 0) / 100);
  }
  return g.mensal || 0;
}
function goalsPending(mk = monthKey(today())){
  return r2(sum(S.goals, g => Math.max(0, goalMonthly(g) - goalTransfersMonth(g.id, mk))));
}
function livre(){
  const mk = monthKey(today());
  const saldo = saldoConta();
  const impostos = taxReserve();
  const fixas = r2(sum(fixasPendentes(mk), f => f.valor));
  const dividas = fase() === 1 ? debtPlanPending(mk) : 0;
  const metas = goalsPending(mk);
  const livre = r2(saldo - impostos - fixas - dividas - metas);
  return { saldo, impostos, fixas, dividas, metas, livre };
}
function monthIncome(mk){ return r2(sum(movsMonth(mk).filter(m => m.tipo === 'receita'), m => m.base ?? m.valor)); }
function monthSpend(mk){ return r2(sum(movsMonth(mk).filter(m => m.tipo === 'despesa' && m.cat !== 'Impostos'), m => m.valor)); }

function quarterOf(d){ return Math.floor(d.getMonth() / 3) + 1; }
function quarterRange(y, q){ return [new Date(y, (q-1)*3, 1), new Date(y, q*3, 0)]; }

function sortedDebts(list = S.debts){
  const strat = S.settings.estrategia;
  const prio = d => d.tipo === 'estado' ? 0 : (d.tipo === 'splitwise' || d.tipo === 'pessoal') ? 2 : 1;
  return [...list].sort((a, b) => {
    if (prio(a) !== prio(b)) return prio(a) - prio(b);
    if (strat === 'menor') return a.saldo - b.saldo;
    return (b.taeg||0) - (a.taeg||0) || a.saldo - b.saldo;
  });
}
/* Simulação mês a mês: prestações + reforço, juros mensais, reforço vai para a 1.ª da lista */
function simulateDebts(extra = 0){
  let debts = sortedDebts(activeDebts()).map(d => ({ id:d.id, saldo:d.saldo, r:(d.taeg||0)/100/12, p:d.prestacao||0 }));
  const end = {}; let juros = 0; const reforco = (S.settings.reforcoDivida || 0) + extra;
  if (!debts.length) return { end, meses:0, juros:0 };
  let mes = 0;
  while (debts.some(d => d.saldo > 0.005) && mes < 600){
    mes++;
    let pool = reforco;
    for (const d of debts){
      if (d.saldo <= 0.005) continue;
      const j = d.saldo * d.r; juros += j; d.saldo += j;
      const pay = Math.min(d.p, d.saldo); d.saldo -= pay;
      if (d.p <= 0 && d.r === 0 && pool <= 0) { /* sem plano */ }
    }
    // dívidas que acabaram libertam a prestação para o reforço (efeito bola)
    pool += sum(debts.filter(d => d.saldo <= 0.005 && end[d.id]), d => d.p);
    for (const d of debts){
      if (d.saldo <= 0.005 || pool <= 0) continue;
      const pay = Math.min(pool, d.saldo); d.saldo -= pay; pool -= pay;
    }
    for (const d of debts) if (d.saldo <= 0.005 && !end[d.id]) end[d.id] = mes;
    if (reforco <= 0 && sum(debts, d => d.p) <= 0) break;
  }
  const left = debts.filter(d => d.saldo > 0.005);
  return { end, meses: left.length ? null : Math.max(0, ...Object.values(end)), juros: r2(juros) };
}

/* ---------- Prazos fiscais ---------- */
function deadlines(fromDate = today(), count = 8){
  const out = [];
  const y0 = fromDate.getFullYear();
  for (const y of [y0, y0+1]){
    for (const p of S.rules.prazos){
      const dia = p.dia === 'ultimo' ? lastDay(y, p.mes) : p.dia;
      const d = new Date(y, p.mes - 1, dia);
      if (d >= fromDate) out.push({ ...p, date:d, iso:iso(d) });
    }
  }
  out.sort((a,b) => a.date - b.date);
  return out.slice(0, count);
}
function ivaAPagarTrimestre(y, q){
  const [a, b] = quarterRange(y, q);
  const A = iso(a), B = iso(b);
  return r2(sum(S.movs.filter(m => m.tipo === 'receita' && m.data >= A && m.data <= B), m => m.iva || 0));
}

/* ---------- Interpretar texto ("gasolina 45") ---------- */
function guessCategory(text){
  const t = norm(text);
  for (const c of S.categories){
    for (const k of (c.kw || [])) if (k && new RegExp(`(^|[^a-z0-9])${norm(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')}([^a-z0-9]|$)`).test(t)) return c.nome;
  }
  // aprende com o histórico: mesma descrição usada antes
  const prev = [...S.movs].reverse().find(m => m.tipo === 'despesa' && m.desc && t.includes(norm(m.desc)));
  return prev ? prev.cat : 'Outros';
}
function parseQuick(text){
  const raw = String(text || '').trim();
  if (!raw) return null;
  const t = norm(raw);
  const numMatch = raw.match(/(\d+(?:[.\s]\d{3})*(?:[.,]\d{1,2})?)\s*(?:€|eur|euros)?/gi);
  let valor = NaN;
  if (numMatch){ valor = parseNum(numMatch[numMatch.length-1].replace(/€|eur(os)?/i,'')); }
  let desc = raw.replace(/(\d+(?:[.\s]\d{3})*(?:[.,]\d{1,2})?)\s*(€|eur|euros)?/gi, '').replace(/\b(com|sem)\s+iva\b/gi,'').replace(/\s+/g,' ').trim();
  const isReceita = /^(recibo|recebi|receita|pagamento de|fatura|factura)\b/.test(t);
  if (isReceita){
    const comIva = /\bcom\s+iva\b/.test(t) || (!/\bsem\s+iva\b/.test(t) && /^recibo/.test(t));
    desc = desc.replace(/^(recebi|receita)\s*/i,'').replace(/^(da|do|de|dos|das)\s+/i,'');
    desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : 'Recibo';
    return { tipo:'receita', valor, desc, comIva };
  }
  desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : '';
  return { tipo:'despesa', valor, desc, cat: guessCategory(raw) };
}

/* ---------- Frases (escritas ou ditadas): perceber qualquer tipo de registo ---------- */
const NUM_RE = /(\d+(?:[.\s]\d{3})*(?:[.,]\d{1,2})?)\s*(?:€|eur(?:os?)?)?/gi;
function lastAmount(text){ const m = String(text).match(NUM_RE); return m ? parseNum(m[m.length-1].replace(/€|eur(os?)?/i,'')) : NaN; }
const has = (t, ...ws) => ws.some(w => new RegExp(`(^|[^a-z])${w}([^a-z]|$)`).test(t));
const PAY = ['paguei','pagar','pago','paga','pagamento','prestacao','reforco','reforcei','amortizei','amortizar','acertei','acerto','liquidei'];
const MOVE = ['pus','poupei','transferi','guardei','meti','reforcei','depositei','pôr','por','transferencia','reservei'];
function matchDebt(t, list = S.debts.filter(d => d.saldo > 0.005)){
  const alias = d => { const n = norm(d.nome); const out = n.split(/[^a-z0-9]+/).filter(w => w.length >= 4);
    if (n.includes('seguranca')) out.push('seguranca social', 'ss');
    if (d.tipo === 'cartao') out.push('cartao'); if (d.tipo === 'splitwise') out.push('splitwise', 'split');
    if (n.includes('financas')) out.push('financas', 'at'); return out.filter(w => !['credito','divida','plano'].includes(w) || list.filter(x => norm(x.nome).includes(w)).length === 1); };
  let best = null, score = 0;
  for (const d of list){ for (const a of alias(d)){ if (has(t, a.replace(/\s+/g, '\\s+')) && a.length > score){ best = d; score = a.length; } } }
  return best;
}
function matchGoal(t){
  const avail = S.goals.filter(g => g.fase === 1 || fase() === 2);
  const find = id => avail.find(g => g.id === id);
  if (has(t, 'ppr') && has(t, 'manel')) return find('ppr_manel');
  if (has(t, 'ppr')) return find('ppr_joao');
  if (has(t, 'emergencia')) return find('emerg');
  if (has(t, 'reserva')) return find('reserva');
  if (has(t, 'investir', 'acoes', 'investimento', 'investimentos', 'corretora')) return find('investir');
  for (const g of avail){ const w = norm(g.nome).split(/[^a-z0-9]+/).filter(x => x.length >= 5 && !['fundo','reserva'].includes(x)); if (w.some(x => has(t, x))) return g; }
  return null;
}
function matchFixa(t){
  let best = null, score = 0;
  for (const f of S.fixas){ for (const w of norm(f.nome).split(/[^a-z0-9]+/).filter(x => x.length >= 4 && !['conta','casa'].includes(x) || norm(f.nome) === x)){ if (has(t, w) && w.length > score){ best = f; score = w.length; } } }
  if (!best && has(t, 'conta conjunta')) best = S.fixas.find(f => norm(f.nome).includes('conjunta')) || null;
  return best;
}
function debtTypeFrom(t){
  if (has(t, 'financas', 'seguranca social', 'ss', 'at', 'coima')) return 'estado';
  if (has(t, 'cartao')) return 'cartao'; if (has(t, 'splitwise', 'split')) return 'splitwise';
  if (has(t, 'habitacao', 'casa')) return 'habitacao'; if (has(t, 'automovel', 'carro')) return 'automovel';
  if (has(t, 'credito', 'emprestimo')) return 'credito'; return 'pessoal';
}
function parseCommand(text){
  const raw = String(text || '').trim().replace(/[.!]+$/, '');
  if (!raw) return null;
  const t = norm(raw);
  // nova dívida: "nova dívida Finanças 600 prestação 50 taeg 9"
  if (/^(nova|adicionar|criar|registar)\s+divida\b/.test(t) || /^devo\b/.test(t)){
    let rest = t; const grab = re => { const m = rest.match(re); if (m){ rest = rest.replace(m[0], ' '); return parseNum(m[1]); } return 0; };
    const prestacao = grab(/presta(?:cao|coes)?\s*(?:de\s*)?(\d+(?:[.,]\d{1,2})?)/);
    const taeg = grab(/(?:taeg|juro|juros|taxa)\s*(?:de\s*)?(\d+(?:[.,]\d{1,2})?)\s*%?/);

      .replace(NUM_RE, '').replace(/\s+/g, ' ').trim().replace(/^((ao|à|a|aos|às|de|do|da|no|na|em)\s+)+/i, '').replace(/\s+(de|do|da|em|no|na)$/i, '').trim();

  const valor = lastAmount(raw);

    return { kind:'imposto', valor, impTipo:taxWord, desc:`Pagamento ${label}`, alt: debt ? { kind:'divida', valor, debtId:debt.id } : null };
  }
  // pagamento de dívida
  if (debt && (has(t, ...PAY) || debtHint)){
    const alt = taxWord ? { kind:'imposto', valor, impTipo:taxWord, desc:`Pagamento ${{ iva:'IVA', irs:'IRS', ss:'Segurança Social' }[taxWord]}` } : null;

  const goal = matchGoal(t);

  const fixa = matchFixa(t);

    case 'receita': { const r = S.rules, iva = a.comIva ? r2(a.valor*r.ivaTaxa) : 0, ss = r2(a.valor*r.ssCoeficiente*r.ssTaxa), irs = r2(a.valor*(S.settings.irsPct||0)/100);

    case 'imposto': { const TB = taxBreakdown(); const res = TB[a.impTipo] ?? 0;

function runAction(a){

    case 'receita': addReceita(S, { data, desc:a.desc, base:a.valor, comIva:a.comIva }); return 'Receita registada e reservas feitas';
    case 'divida': { const d = S.debts.find(x => x.id === a.debtId); payDebt(d, Math.min(a.valor, d.saldo), data); return d.saldo <= 0.005 ? `${d.nome} está paga!` : `Falta ${eur(d.saldo)} em ${d.nome}`; }
    case 'imposto': S.movs.push({ id:uid(), data, tipo:'despesa', valor:r2(a.valor), cat:'Impostos', impTipo:a.impTipo, desc:a.desc }); return `${a.desc} registado`;
    case 'transferencia': { const g = S.goals.find(x => x.id === a.goalId); S.movs.push({ id:uid(), data, tipo:'transferencia', valor:r2(a.valor), metaId:g.id, desc:g.nome }); g.saldo = r2((g.saldo||0) + a.valor); return `${eur(a.valor)} para ${g.nome}`; }
    case 'fixa': { const f = S.fixas.find(x => x.id === a.fixaId); S.movs.push({ id:uid(), data, tipo:'despesa', valor:r2(a.valor), cat:f.cat, desc:f.nome, fixaId:f.id }); return `${f.nome} marcada como paga`; }

    <div class="item"><p class="grow muted">IVA</p><p class="t15">${eur(m.iva)}</p></div>
    <div class="item"><p class="grow muted">Reservado SS</p><p class="t15">${eur(m.reservas?.ss)}</p></div>
    <div class="item"><p class="grow muted">Reservado IRS</p><p class="t15">${eur(m.reservas?.irs)}</p></div></div></div>` : '';
  openSheet(`<div class="between"><h2>${esc(m.desc || m.cat)}</h2><button class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>
    <p class="num big" style="margin:0">${m.tipo==='receita'?'+':'−'} ${eur(m.valor)}</p>
    <p class="muted" style="margin:0">${shortDate(m.data)} · ${esc({despesa:'Despesa',receita:'Receita',transferencia:'Transferência para meta',divida:'Pagamento de dívida'}[m.tipo])}${m.cat ? ' · ' + esc(m.cat) : ''}</p>
    ${extra}
    ${m.tipo==='despesa' ? `<label class="field"><span>Categoria</span><select class="input" id="mvCat">${S.categories.map(c => `<option ${c.nome===m.cat?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>` : ''}
    <button class="btn danger" id="mvDel">${ic('trash',18)} Apagar registo</button>`, sh => {
      const sel = $('#mvCat', sh); if (sel) sel.onchange = () => { m.cat = sel.value; save(); toast('Categoria alterada'); };
      $('#mvDel', sh).onclick = async () => {
        if (!await ask('Apagar este registo?', { ok:'Apagar', danger:true })) return;
        if (m.tipo === 'divida'){ const d = S.debts.find(x => x.id === m.dividaId); if (d) d.saldo = r2(d.saldo + m.valor); }
        if (m.tipo === 'transferencia'){ const g = S.goals.find(x => x.id === m.metaId); if (g) g.saldo = r2(g.saldo - m.valor); }
        S.movs = S.movs.filter(x => x.id !== m.id); save(); closeSheet(); render();
      };
    }, () => render());
}

/* ---------- Sheet / formulários ---------- */
let sheetOnClose = null;
function openSheet(html, bind, onClose){
  closeSheet(true);
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheetBg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  sheetOnClose = onClose || null;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); });
  if (bind) bind(bg.firstElementChild);
  const f = bg.querySelector('input,select,textarea'); if (f && !f.dataset.nofocus) setTimeout(() => f.focus(), 50);
}
function closeSheet(silent){
  const bg = $('#sheetBg'); if (bg) bg.remove();
  const cb = sheetOnClose; sheetOnClose = null;
  if (!silent && cb) cb();
}
/* Diálogo próprio (substitui confirm/prompt do sistema) */
function ask(msg, { input = null, ok = 'Confirmar', danger = false, placeholder = '', value = '' } = {}){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; closeSheet(true); resolve(v); };
    openSheet(`<p style="margin:0;font-size:16px;white-space:pre-line">${esc(msg)}</p>
      ${input ? `<input class="input" id="askIn" type="${input}" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off">` : ''}
      <button class="btn ${danger ? 'danger' : ''}" id="askOk">${esc(ok)}</button>
      <button class="btn sec" id="askNo">Cancelar</button>`, sh => {
        $('#askOk', sh).onclick = () => finish(input ? $('#askIn', sh).value : true);
        $('#askNo', sh).onclick = () => finish(input ? null : false);
        const i = $('#askIn', sh); if (i) i.onkeydown = e => { if (e.key === 'Enter') finish(i.value); };
      }, () => finish(input ? null : false));
  });
}
/* fields: [{k,label,type:'text'|'num'|'select'|'date'|'textarea', options, value, hint}] */
function formSheet(title, fields, onSave, onDelete){
  const f = fields.map(x => {
    const id = 'f_' + x.k;
    if (x.type === 'select') return `<label class="field"><span>${esc(x.label)}</span><select class="input" id="${id}">${x.options.map(o => { const [v,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(v)===String(x.value)?'selected':''}>${esc(l)}</option>`; }).join('')}</select>${x.hint?`<small class="muted">${esc(x.hint)}</small>`:''}</label>`;
    if (x.type === 'textarea') return `<label class="field"><span>${esc(x.label)}</span><textarea class="input" id="${id}" style="height:90px;padding:12px">${esc(x.value ?? '')}</textarea></label>`;
    const type = x.type === 'num' ? 'text' : (x.type || 'text');
    const mode = x.type === 'num' ? 'inputmode="decimal"' : '';
    const val = x.type === 'num' && x.value != null && x.value !== '' ? String(x.value).replace('.', ',') : (x.value ?? '');
    return `<label class="field"><span>${esc(x.label)}</span><input class="input" id="${id}" type="${type}" ${mode} value="${esc(val)}" ${x.placeholder?`placeholder="${esc(x.placeholder)}"`:''}>${x.hint?`<small class="muted">${esc(x.hint)}</small>`:''}</label>`;
  }).join('');
  openSheet(`<div class="between"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>${f}
    <button class="btn" id="fSave">Guardar</button>${onDelete ? `<button class="btn danger" id="fDel">Apagar</button>` : ''}`, sh => {
      $('#fSave', sh).onclick = () => {
        const out = {};
        for (const x of fields){
          const el = $('#f_' + x.k, sh); let v = el.value;
          if (x.type === 'num'){ v = v.trim() === '' ? 0 : parseNum(v); if (isNaN(v)){ toast(`Valor inválido em “${x.label}”`); el.focus(); return; } }
          out[x.k] = v;
        }
        if (onSave(out) !== false){ save(); closeSheet(); render(); }
      };
      if (onDelete) $('#fDel', sh).onclick = async () => { if (await ask(`Apagar “${title}”?`, { ok:'Apagar', danger:true })){ onDelete(); save(); render(); } };
    });
}

/* ---------- Ecrã: Registar ---------- */
let REG = null;
function vRegistar(){

    const p = parseQuick(REG.text); if (p && !arg.tipo) REG.tipo = p.tipo;
    routeArg = null;
  }
  const tipos = [['despesa','Despesa'],['receita','Receita'],['transferencia','Para meta'],['divida','Dívida']];
  return `<main class="view" style="padding-bottom:calc(env(safe-area-inset-bottom) + 24px)">

  <div class="seg" role="group" aria-label="Tipo de movimento">${tipos.map(([k,l]) => `<button type="button" data-tipo="${k}" class="${REG.tipo===k?'on':''}" aria-pressed="${REG.tipo===k}">${l}</button>`).join('')}</div>

}

                         : `<label class="field"><span>IVA</span><select class="input" id="rIva"><option value="1">Com IVA ${Math.round(S.rules.ivaTaxa*100)}%</option><option value="0">Sem IVA / isento</option></select></label>`}

/* ---------- Ecrã: Mês ---------- */
function vMes(){
  const t = today(); const d = new Date(t.getFullYear(), t.getMonth() + mesOffset, 1); const mk = monthKey(d);
  const ms = movsMonth(mk).filter(m => m.tipo === 'despesa' && m.cat !== 'Impostos');
  const gasto = sum(ms, m => m.valor);
  const fixas = sum(ms.filter(m => m.fixaId), m => m.valor);
  const orc = sum(S.categories, c => c.orc || 0);
  const byCat = S.categories.map(c => ({ ...c, v: sum(ms.filter(m => m.cat === c.nome), m => m.valor) })).filter(c => c.v > 0 || c.orc > 0);
  // média dos 6 meses anteriores por categoria (só meses com registos)
  const prevKeys = [...Array(6)].map((_, i) => monthKey(new Date(d.getFullYear(), d.getMonth() - 1 - i, 1)));
  const withData = prevKeys.filter(k => movsMonth(k).length);
  let insight = '';
  if (withData.length >= 2){
    let best = null;
    for (const c of byCat){
      const avg = sum(withData, k => sum(movsMonth(k).filter(m => m.tipo === 'despesa' && m.cat === c.nome), m => m.valor)) / withData.length;
      if (avg > 20 && c.v > avg * 1.15){ const pct = Math.round((c.v / avg - 1) * 100); if (!best || pct > best.pct) best = { nome:c.nome, pct }; }
    }
    if (best) insight = `<p class="note blue">${esc(best.nome)} este mês está ${best.pct}% acima da tua média de ${withData.length} meses.</p>`;
  }
  const subs = S.fixas.filter(f => f.cat === 'Subscrições');
  const rec = monthIncome(mk); const base = S.settings.mesBase || 0;
  const excedente = r2(rec - base);
  return `<main class="view">
  <div class="between">
    <button class="iconbtn" id="mPrev" aria-label="Mês anterior" style="margin-left:-10px">${ic('chevl',22)}</button>
    <h1 style="font-size:20px;text-transform:capitalize">${MESES[d.getMonth()]} ${d.getFullYear()}</h1>
    <button class="iconbtn" id="mNext" aria-label="Mês seguinte" style="margin-right:-10px" ${mesOffset>=0?'disabled':''}>${ic('chev',22)}</button>
  </div>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="between" style="align-items:flex-end"><div><p class="lbl">Gasto</p><p class="num big" style="margin:2px 0 0">${eur0(gasto)}</p></div><p class="small muted" style="margin:0 0 6px">orçamento ${eur0(orc)}</p></div>
    ${bar(orc ? gasto / orc * 100 : 0, gasto > orc ? '#B45309' : 'var(--ink)')}
    <div class="row small muted" style="gap:16px"><span><b style="color:var(--ink)">${eur0(fixas)}</b> fixas</span><span><b style="color:var(--ink)">${eur0(gasto - fixas)}</b> variáveis</span></div>
  </section>
  ${base ? `<section class="card"><div class="between"><div><p class="lbl">Recebido (sem IVA)</p><p class="num" style="font-size:22px;margin:2px 0 0">${eur0(rec)}</p></div><div style="text-align:right"><p class="lbl">Mês base</p><p class="num" style="font-size:22px;margin:2px 0 0">${eur0(base)}</p></div></div>
    <p class="small" style="margin:10px 0 0;${excedente>=0?'color:var(--teal)':'color:var(--amber)'};font-weight:600">${excedente >= 0 ? `+${eur0(excedente)} acima do mês base → podes passar para a Reserva de rendimento` : `Faltam ${eur0(-excedente)} para o mês base → podes tirar da Reserva de rendimento`}</p></section>` : ''}
  ${insight}
  <section class="card" style="display:flex;flex-direction:column;gap:13px" aria-label="Por categoria">
    <div class="between"><h2>Por categoria</h2><button class="btn sm sec" id="editOrc">Orçamentos</button></div>
    ${byCat.length ? byCat.map(c => `<div style="display:flex;flex-direction:column;gap:6px"><div class="between" style="font-size:14px"><span style="font-weight:600">${esc(c.nome)}</span><span class="muted"><b style="color:var(--ink)">${eur0(c.v)}</b>${c.orc ? ` de ${eur0(c.orc)}` : ''}</span></div>${bar(c.orc ? c.v / c.orc * 100 : (c.v ? 100 : 0), c.orc && c.v > c.orc ? '#B45309' : '')}</div>`).join('') : '<p class="empty">Sem gastos neste mês.</p>'}
  </section>
  <section class="card"><div class="between"><div><p class="t15" style="margin:0">${subs.length} subscriç${subs.length===1?'ão':'ões'}</p><p class="small muted" style="margin:2px 0 0">despesas fixas da categoria Subscrições</p></div>
    <div style="text-align:right"><p class="t15" style="margin:0">${eur(sum(subs, f => f.valor))}/mês</p><p class="small muted" style="margin:2px 0 0">${eur0(sum(subs, f => f.valor) * 12)} por ano</p></div></div></section>
  <section class="card"><div class="between"><h2>Despesas fixas</h2><button class="btn sm sec" id="addFixa">+ Adicionar</button></div>
    <div class="list" style="margin-top:6px">${S.fixas.length ? [...S.fixas].sort((a,b)=>a.dia-b.dia).map(f => `<button class="item" data-fixa="${f.id}" style="width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;cursor:pointer;color:inherit"><div class="grow"><p class="t15">${esc(f.nome)}</p><p class="small muted">dia ${f.dia} · ${esc(f.cat)}${f.detalhe ? ' · ' + esc(f.detalhe) : ''}</p></div><p class="num" style="font-size:15px">${eur(f.valor)}</p></button>`).join('') : '<p class="empty">Ex.: conta conjunta, escola, Netflix…</p>'}</div></section>
  </main>`;
}

function fixaForm(f){

/* ---------- Ecrã: Metas ---------- */
function vMetas(){
  const F = fase(); const sim = simulateDebts();
  const now = S.goals.filter(g => g.fase === 1); const fut = S.goals.filter(g => g.fase === 2);
  const avgSpend = (() => { const ks = [...Array(6)].map((_, i) => monthKey(new Date(today().getFullYear(), today().getMonth() - i, 1))).filter(k => movsMonth(k).length); return ks.length ? sum(ks, k => monthSpend(k)) / ks.length : 0; })();
  const goalCard = g => {
    const pct = g.alvo ? g.saldo / g.alvo * 100 : 0;
    const sub = g.tipo === 'emergencia' && avgSpend ? `${String(Math.round(g.saldo / avgSpend * 10) / 10).replace('.', ',')} meses de despesa` : g.tipo === 'reserva' ? 'enche nos meses acima do mês base' : (g.alvo ? `meta ${eur0(g.alvo)}` : 'sem meta definida');
    const mensal = goalMonthly(g);
    return `<button class="card" data-goal="${g.id}" style="display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:inherit;width:100%">
      <div class="between" style="width:100%"><p class="t15" style="margin:0">${esc(g.nome)}</p><p class="num" style="margin:0;font-size:15px">${eur0(g.saldo)}</p></div>
      <div style="width:100%">${bar(pct, g.tipo==='emergencia'?'#7C3AED':'')}</div>
      <div class="between small muted" style="width:100%"><span>${sub}</span><span>${mensal ? '+' + eur0(mensal) + '/mês' : (g.alvo ? `meta ${eur0(g.alvo)}` : '')}</span></div></button>`;
  };
  return `<main class="view">
  <h1>Metas</h1>
  ${F === 1 ? `<section class="note blue" style="display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px">
    <b style="font-size:12px;letter-spacing:.4px">FASE 1 · DEVER MENOS</b>
    <span style="font-size:15px;font-weight:600">${sim.meses == null ? 'Define prestações nas dívidas para veres a data de fim' : `A dívida acaba em ${monthsToLabel(sim.meses)}`}</span>
    <span>Depois, ${eur0(S.settings.valorFuturo || 0)}/mês passam para as metas do futuro.</span></section>`
  : `<section class="note green" style="display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px"><b style="font-size:12px;letter-spacing:.4px">FASE 2 · CONSTRUIR</b><span style="font-size:15px;font-weight:600">Sem dívidas. ${eur0(S.settings.valorFuturo || 0)}/mês vão para o futuro, antes de gastares.</span></section>`}
  ${now.map(goalCard).join('')}
  <section class="card" style="padding:12px 16px 4px">
    <div class="between"><p class="t15" style="margin:0">Futuro${F===1 ? ` · começa em ${futureStartLabel()}` : ''}</p><button class="btn sm sec" id="editFut">Ajustar</button></div>
    <div class="list">${fut.map(g => `<div class="item">${F===1 ? `<span class="muted">${ic('lock',18)}</span>` : ''}<p class="grow t15">${esc(g.nome)}</p><p class="small muted">${g.pct}% · ${eur0(goalMonthly(g))}/mês${g.saldo ? ` · tens ${eur0(g.saldo)}` : ''}</p></div>`).join('')}</div>
  </section>
  <a href="#registar" id="toTransfer" class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Transferir para uma meta</a>
  <a href="#patrimonio" class="card between" style="text-decoration:none;color:inherit"><div><p class="t15" style="margin:0">Património líquido</p><p class="small muted" style="margin:2px 0 0">o que tens menos o que deves</p></div><div class="row" style="gap:6px"><span class="num" style="font-size:17px">${eur0(patrimonio().liquido)}</span>${ic('chev',20)}</div></a>
  <a href="#dividas" class="card between" style="text-decoration:none;color:inherit"><div><p class="t15" style="margin:0">Dívidas</p><p class="small muted" style="margin:2px 0 0">${S.debts.filter(d=>d.saldo>0.005).length} em aberto</p></div><div class="row" style="gap:6px"><span class="num" style="font-size:17px;color:var(--amber)">${eur0(sum(S.debts.filter(d=>d.saldo>0), d => d.saldo))}</span>${ic('chev',20)}</div></a>
  </main>`;
}
AFTER.metas = () => {
  $('#toTransfer').onclick = e => { e.preventDefault(); go('registar', { tipo:'transferencia' }); };
  document.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => {
    const g = S.goals.find(x => x.id === b.dataset.goal);
    formSheet(g.nome, [
      { k:'nome', label:'Nome', value:g.nome },
      { k:'saldo', label:'Quanto tens hoje', type:'num', value:g.saldo },

      { k:'mensal', label:'Pôr por mês (sai antes do Livre para gastar)', type:'num', value:g.mensal }
    ], out => { Object.assign(g, { nome:out.nome.trim() || g.nome, saldo:r2(out.saldo), alvo:r2(out.alvo), mensal:r2(out.mensal) }); });
  });
  $('#editFut').onclick = () => {
    const fut = S.goals.filter(g => g.fase === 2);
    formSheet('Metas do futuro', [
      { k:'valor', label:'Valor por mês para o futuro', type:'num', value:S.settings.valorFuturo, hint:'Começa automaticamente quando a última dívida acabar.' },
      ...fut.map(g => ({ k:g.id, label:`${g.nome} (%)`, type:'num', value:g.pct })),
      ...fut.map(g => ({ k:'s_'+g.id, label:`${g.nome} · quanto tens hoje`, type:'num', value:g.saldo }))
    ], out => {
      const tot = sum(fut, g => out[g.id]);
      if (Math.abs(tot - 100) > 0.5){ toast(`As percentagens somam ${Math.round(tot)}%, têm de somar 100%`); return false; }
      S.settings.valorFuturo = r2(out.valor); fut.forEach(g => { g.pct = r2(out[g.id]); g.saldo = r2(out['s_'+g.id]); });
    });
  };
};

/* ---------- Ecrã: Património ---------- */
function patrimonio(){
  const conta = saldoConta();
  const fundos = sum(S.goals, g => g.saldo || 0);
  const acoes = S.settings.investimentosValor || 0;
  const aReceber = sum(S.debts.filter(d => d.saldo < 0), d => -d.saldo);
  const deve = sum(S.debts.filter(d => d.saldo > 0), d => d.saldo);
  const tem = conta + fundos + acoes + aReceber;
  return { conta, fundos, acoes, aReceber, tem, deve, liquido: r2(tem - deve) };
}
function vPatrimonio(){
  const P = patrimonio();
  const byType = t => sum(S.debts.filter(d => d.saldo > 0 && t.includes(d.tipo)), d => d.saldo);
  const row = (a, b) => `<div class="between" style="font-size:14px;padding:4px 0"><span class="muted">${a}</span><b>${b}</b></div>`;
  return `<main class="view">${backHeader('Património','metas')}
  <section class="card"><p class="lbl">Património líquido</p><p class="num" style="font-size:40px;margin:2px 0 0">${eur0(P.liquido)}</p></section>
  <div class="grid2">
    <section class="card" style="padding:14px"><p class="lbl">Tens</p><p class="num" style="font-size:22px;margin:2px 0 8px">${eur0(P.tem)}</p>${row('Conta', eur0(P.conta))}${row('Metas e fundos', eur0(P.fundos))}${row('Ações', eur0(P.acoes))}${P.aReceber ? row('A receber', eur0(P.aReceber)) : ''}</section>
    <section class="card" style="padding:14px"><p class="lbl">Deves</p><p class="num" style="font-size:22px;margin:2px 0 8px;color:var(--amber)">${eur0(P.deve)}</p>${row('Estado', eur0(byType(['estado'])))}${row('Cartão', eur0(byType(['cartao'])))}${row('Créditos', eur0(byType(['credito','habitacao','automovel'])))}${row('Pessoas', eur0(byType(['splitwise','pessoal'])))}</section>
  </div>
  <button class="btn sec" id="editAcoes">Atualizar valor das ações</button>
  <a href="#dividas" class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Ver dívidas</a>
  <p class="small muted" style="margin:0">O valor das ações é atualizado por ti (o que a corretora mostra). O registo de compras e vendas para o Anexo J chega na próxima versão.</p>
  </main>`;
}
AFTER.patrimonio = () => {
  $('#editAcoes').onclick = () => formSheet('Valor atual das ações', [{ k:'v', label:'Valor total na corretora', type:'num', value:S.settings.investimentosValor }], out => { S.settings.investimentosValor = r2(out.v); });
};

/* ---------- Ecrã: Dívidas ---------- */
const DEBT_TYPES = [['estado','Estado (Finanças / Segurança Social)'],['cartao','Cartão de crédito'],['credito','Crédito pessoal'],['automovel','Crédito automóvel'],['habitacao','Crédito habitação'],['splitwise','Splitwise (saldo a acertar)'],['pessoal','Pessoal (sem juros)']];
function vDividas(){
  const open = sortedDebts(S.debts.filter(d => d.saldo > 0.005));
  const closed = S.debts.filter(d => d.saldo <= 0.005);
  const sim = simulateDebts(); const sim50 = simulateDebts(50);
  const total = sum(open, d => d.saldo);
  const rowD = (d, i) => {
    const endM = sim.end[d.id];
    const info = d.tipo === 'splitwise' ? 'atualizas quando acertas contas' : `${d.prestacao ? eur0(d.prestacao) + '/mês' : 'sem prestação'}${endM ? ' · acaba ' + monthsToLabel(endM) : ''}`;
    return `<button class="item" data-debt="${d.id}" style="width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;cursor:pointer;color:inherit;align-items:flex-start">
      <span class="rank ${i<3?'on':''}">${i+1}</span>
      <div class="grow" style="display:flex;flex-direction:column;gap:4px"><div class="between"><p class="t15">${esc(d.nome)}${d.tipo==='estado'?'<span class="badge">ESTADO</span>':''}</p><p class="num" style="font-size:15px;color:var(--amber)">${eur0(d.saldo)}</p></div>
      <p class="small muted">${(() => { const lab = DEBT_TYPES.find(t => t[0]===d.tipo)?.[1] || ''; const parts = []; if (d.tipo !== 'estado' && !norm(lab).startsWith(norm(d.nome))) parts.push(esc(lab)); if (d.taeg) parts.push(`TAEG ${String(d.taeg).replace('.',',')}%`); if (d.nota) parts.push(esc(d.nota)); return parts.join(' · '); })()}</p><p class="small">${info}</p></div></button>`;
  };
  return `<main class="view">${backHeader('Dívidas','metas')}
  <div class="between" style="align-items:flex-end"><div><p class="lbl">Total em dívida</p><p class="num big" style="margin:2px 0 0;color:var(--amber)">${eur0(total)}</p></div>
    <p class="small muted" style="margin:0 0 6px;text-align:right">${open.length} em aberto<br>${sim.meses ? 'livre em ' + monthsToLabel(sim.meses) : ''}</p></div>
  <div class="seg" role="group" aria-label="Ordem de pagamento">
    <button type="button" data-strat="estado_juro" class="${S.settings.estrategia!=='menor'?'on':''}">Estado, depois maior juro</button>
    <button type="button" data-strat="menor" class="${S.settings.estrategia==='menor'?'on':''}">Menor valor primeiro</button></div>
  <section class="card tight">${open.length ? `<div class="list">${open.map(rowD).join('')}</div>` : '<p class="empty">Sem dívidas em aberto.</p>'}</section>
  <div class="grid2"><button class="btn sec" id="payD">Registar pagamento</button><button class="btn ghost" id="addD">+ Adicionar dívida</button></div>
  <section class="card"><div class="between"><p class="t15" style="margin:0">Reforço mensal</p><button class="btn sm sec" id="editRef">${eur0(S.settings.reforcoDivida)}/mês</button></div>
    <p class="small muted" style="margin:6px 0 0">Vai todo para a dívida n.º 1 da lista, além das prestações. Sai antes do Livre para gastar.</p></section>
  ${sim.meses && sim50.meses ? `<section class="note green" style="display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:20px"><b>E se pagar mais 50 €/mês?</b><span>Acabas em <b>${monthsToLabel(sim50.meses)}</b> em vez de ${monthsToLabel(sim.meses)}${sim.juros - sim50.juros > 1 ? ` e poupas cerca de ${eur0(sim.juros - sim50.juros)} em juros` : ''}.</span></section>` : ''}
  ${closed.length ? `<section class="card tight"><p class="lbl" style="padding-top:10px">Pagas</p><div class="list">${closed.map(d => `<button class="item" data-debt="${d.id}" style="width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;color:inherit"><p class="grow t15">${esc(d.nome)}</p><span style="color:var(--teal)">${ic('check',18,2.2)}</span></button>`).join('')}</div></section>` : ''}
  <p class="small muted" style="margin:0">As dívidas ao Estado ficam sempre primeiro: juros de mora e risco de penhora. Datas estimadas com os juros indicados.</p>
  </main>`;
}

/* ---------- Ecrã: Impostos ---------- */

  const QA = iso(qa), QB = iso(qb);
  const recQ = S.movs.filter(m => m.tipo === 'receita' && m.data >= QA && m.data <= QB);
  const ivaQ = sum(recQ, m => m.iva || 0); const baseQ = sum(recQ, m => m.base || 0);
  const ssMensalProx = r2(baseQ * S.rules.ssCoeficiente * S.rules.ssTaxa / 3);
  const TB = taxBreakdown();
  const dls = deadlines(t, 6);
  const prevQ = q === 1 ? [y-1, 4] : [y, q-1];
  const ivaPrev = ivaAPagarTrimestre(...prevQ);
  const recY = S.movs.filter(m => m.tipo === 'receita' && m.data.startsWith(String(y)));
  const outdated = S.rules.ano < y;
  return `<main class="view">
  <div class="between"><h1>Impostos</h1><span class="pill ${outdated?'amber':'teal'}">Regras ${esc(S.rules.ano)}${outdated?' · rever':' ✓'}</span></div>
  ${outdated ? `<p class="note amber">As regras fiscais são de ${S.rules.ano}. Confirma as taxas e datas deste ano em Definições → Regras fiscais.</p>` : ''}
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <p class="t15" style="margin:0">${q}.º trimestre · ${MES3[(q-1)*3]}–${MES3[q*3-1]}</p>
    <div class="grid2">
      <div><p class="lbl">IVA acumulado</p><p class="num" style="font-size:22px;margin:2px 0 0">${eur0(ivaQ)}</p><p class="small muted" style="margin:2px 0 0">a pagar no trimestre seguinte</p></div>
      <div><p class="lbl">SS por mês a seguir</p><p class="num" style="font-size:22px;margin:2px 0 0">${eur0(ssMensalProx)}</p><p class="small muted" style="margin:2px 0 0">estimativa pelos recibos</p></div>
    </div>
  </section>
  <section class="card" aria-label="Reservado"><p class="t15" style="margin:0 0 8px">Reservado na conta</p>
    <div class="list">
      <div class="item"><p class="grow">IVA</p><p class="t15">${eur(TB.iva)}</p></div>
      <div class="item"><p class="grow">Segurança Social</p><p class="t15">${eur(TB.ss)}</p></div>
      <div class="item"><p class="grow">IRS</p><p class="t15">${eur(TB.irs)}</p></div>
    </div>
    ${ivaPrev ? `<p class="small" style="margin:8px 0 0;color:var(--teal);font-weight:600">IVA do ${prevQ[1]}.º trimestre (${prevQ[0]}) pelos teus registos: ${eur(ivaPrev)}</p>` : ''}
    <p class="small muted" style="margin:8px 0 0">Quando pagares, regista uma despesa na categoria Impostos e escolhe qual. A reserva desce sozinha.</p>
  </section>
  <section class="card tight" aria-label="Próximos prazos"><p class="lbl" style="padding-top:10px">Próximos prazos</p><div class="list">
    ${dls.map((p, i) => `<div class="item"><div style="width:44px;text-align:center;flex-shrink:0"><p class="num" style="font-size:18px;line-height:1;${i<2?'color:var(--amber)':''}">${p.date.getDate()}</p><p class="small muted" style="margin-top:2px">${MES3[p.date.getMonth()]}</p></div><div class="grow"><p class="t15">${esc(p.nome)}</p><p class="small muted">${esc(p.ref)}</p></div></div>`).join('')}
  </div></section>
  <button class="btn sec" id="ics">${ic('cal',18)} Enviar prazos para o Calendário</button>
  <section class="card" aria-label="IRS">
    <div class="between" style="margin-bottom:6px"><p class="t15" style="margin:0">IRS de ${y}</p><p class="small muted" style="margin:0">entrega abr–jun ${y+1}</p></div>
    <div class="list">
      <div class="item"><p class="grow small"><b>Recibos verdes</b><br><span class="muted">${recY.length} recibos · valor sem IVA</span></p><p class="t15">${eur(sum(recY, m => m.base || 0))}</p></div>
      <div class="item"><p class="grow small"><b>IVA liquidado</b><br><span class="muted">no ano</span></p><p class="t15">${eur(sum(recY, m => m.iva || 0))}</p></div>
      <div class="item"><p class="grow small"><b>Anexo J · ações</b><br><span class="muted">DEGIRO, Trade Republic: registo de compras/vendas na próxima versão</span></p></div>
    </div>
  </section>
  </main>`;
}

AFTER.definicoes = () => {
  const labels = { saldoInicial:'Saldo inicial da conta', mesBase:'Mês base (por mês)', irsPct:'Reserva para IRS (%)' };
  document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { const k = b.dataset.set; formSheet(labels[k], [{ k:'v', label:labels[k], type:'num', value:S.settings[k] }], out => { S.settings[k] = r2(out.v); if (k === 'mesBase'){ const g = S.goals.find(x => x.id === 'reserva'); if (g && !g.alvo) g.alvo = r2(out.v); } }); });
  $('#editRules').onclick = () => formSheet('Taxas', [
    { k:'ano', label:'Ano das regras', type:'num', value:S.rules.ano },
    { k:'iva', label:'IVA (%)', type:'num', value:r2(S.rules.ivaTaxa*100) },
    { k:'ss', label:'Taxa Segurança Social (%)', type:'num', value:r2(S.rules.ssTaxa*100) },
    { k:'coef', label:'Coeficiente SS sobre serviços (%)', type:'num', value:r2(S.rules.ssCoeficiente*100) }
  ], out => { S.rules.ano = Math.round(out.ano); S.rules.ivaTaxa = out.iva/100; S.rules.ssTaxa = out.ss/100; S.rules.ssCoeficiente = out.coef/100; S.rules.versao = `${S.rules.ano}.manual`; });
  $('#updRules').onclick = updateRulesFlow;
  $('#bkExp').onclick = exportBackup;
  $('#bkImp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const v = JSON.parse(await f.text());
      if (!v.ct || !(v.v === 2 ? v.wrapP : v.salt)) throw new Error('formato');
      const secret = await ask('Palavra-passe dessa cópia (ou o código de recuperação):', { input:'password', ok:'Abrir' }); if (!secret) return;
      let r;
      try { r = await openWithPass(v, secret); } catch(e1){ if (v.v === 2) r = await openWithCode(v, secret); else throw e1; }
      if (!await ask(`Substituir os dados atuais pela cópia (${r.data.movs?.length || 0} movimentos)?`, { ok:'Substituir', danger:true })) return;
      S = r.data; KEY = r.key; DEK_RAW = r.raw;
      const { app:_a, ...vault } = v;
      if (r.legacy){ const { fields, code } = await newVaultKeys(secret); VAULT = fields; await saveNow(); showRecoveryCode(code, () => { location.hash = 'hoje'; render(); }); return; }
      VAULT = vault; writeVault(VAULT); toast('Cópia restaurada'); render();
    } catch(err){ toast('Não foi possível abrir: palavra-passe/código errado ou ficheiro inválido'); }
  };
  $('#csvExp').onclick = () => {
    const rows = [['Data','Tipo','Descrição','Categoria','Valor','Valor sem IVA','IVA','Reserva SS','Reserva IRS']];
    for (const m of [...S.movs].sort((a,b) => a.data.localeCompare(b.data))) rows.push([m.data, m.tipo, m.desc||'', m.cat||'', m.valor, m.base??'', m.iva??'', m.reservas?.ss??'', m.reservas?.irs??''].map(x => typeof x === 'number' ? String(x).replace('.', ',') : x));
    download(`movimentos-${iso(today())}.csv`, '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n'), 'text/csv');
  };
  $('#lockNow').onclick = lock;
  $('#chPass').onclick = () => {
    openSheet(`<div class="between"><h2>Alterar palavra-passe</h2><button class="iconbtn" data-close aria-label="Fechar">${ic('x')}</button></div>
      <label class="field"><span>Palavra-passe atual</span><input class="input" type="password" id="p0" autocomplete="current-password"></label>
      <label class="field"><span>Nova palavra-passe (mín. 8)</span><input class="input" type="password" id="p1" autocomplete="new-password"></label>
      <label class="field"><span>Repetir</span><input class="input" type="password" id="p2" autocomplete="new-password"></label>
      <button class="btn" id="pSave">Alterar</button>`, sh => {
        $('#pSave', sh).onclick = async () => {
          const p0 = $('#p0', sh).value, p1 = $('#p1', sh).value, p2 = $('#p2', sh).value;
          try { await openWithPass(VAULT, p0); } catch(e){ toast('Palavra-passe atual errada'); return; }
          if (p1.length < 8){ toast('A nova palavra-passe precisa de 8 caracteres'); return; }
          if (p1 !== p2){ toast('As palavras-passe não coincidem'); return; }
          await rewrapPass(p1); writeVault(VAULT);
          closeSheet(true); toast('Palavra-passe alterada. O código de recuperação continua válido.');
        };
      });
  };
  $('#newCode').onclick = async () => {
    const p = await ask('Gerar um código novo? O código antigo deixa de funcionar.\n\nConfirma com a tua palavra-passe:', { input:'password', ok:'Gerar código' });
    if (!p) return;
    try { await openWithPass(VAULT, p); } catch(e){ toast('Palavra-passe errada'); return; }
    const code = await newCodeForVault(); writeVault(VAULT);
    showRecoveryCode(code, () => render());
  };
  $('#wipe').onclick = async () => {
    const w = await ask('Apagar TODOS os dados deste telemóvel? Só os recuperas com uma cópia de segurança.\n\nEscreve APAGAR para confirmar.', { input:'text', ok:'Apagar tudo', danger:true, placeholder:'APAGAR' });
    if (w !== 'APAGAR') return;
    await wipeVault(); S = null; KEY = null; DEK_RAW = null; VAULT = null; location.hash = ''; render();
  };
};
/* Cópia de segurança: no iPhone abre a folha de partilha → "Guardar em Ficheiros" → iCloud Drive */
async function exportBackup(){
  if (!VAULT) return;
  await saveNow();
  const name = `pura-vida-copia-${iso(today())}.json`;
  const content = JSON.stringify({ app:'pura-vida', ...VAULT });
  let ok = false;
  try {
    const file = new File([content], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Cópia Pura Vida' }); ok = true;
    }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  if (!ok){ download(name, content, 'application/json'); ok = true; }
  S.settings.ultimaCopia = iso(today()); save();
  toast('Cópia feita. Guarda-a no iCloud Drive (Ficheiros).');
  render();
}
function backupDue(){
  if (!S || !S.movs.length) return false;
  const last = S.settings.ultimaCopia; if (!last) return true;
  return (today() - new Date(last + 'T00:00:00')) / 86400000 >= 7;
}
async function updateRulesFlow(){
  const url = await ask('Endereço do ficheiro de regras (JSON). Fica guardado para os próximos anos.', { input:'url', ok:'Atualizar', value:S.settings.regrasUrl || '', placeholder:'https://…/regras.json' });
  if (!url) return;
  try {
    const res = await fetch(url, { cache:'no-store' }); if (!res.ok) throw new Error(res.status);
    const nr = await res.json();
    const ok = nr && typeof nr.ano === 'number' && nr.ivaTaxa > 0 && nr.ivaTaxa < 1 && nr.ssTaxa > 0 && nr.ssTaxa < 1 && nr.ssCoeficiente > 0 && nr.ssCoeficiente <= 1 && Array.isArray(nr.prazos) && nr.prazos.every(p => p.nome && p.mes >= 1 && p.mes <= 12);
    if (!ok) throw new Error('formato');
    const ch = [];
    if (nr.ano !== S.rules.ano) ch.push(`Ano: ${S.rules.ano} → ${nr.ano}`);
    if (nr.ivaTaxa !== S.rules.ivaTaxa) ch.push(`IVA: ${S.rules.ivaTaxa*100}% → ${nr.ivaTaxa*100}%`);
    if (nr.ssTaxa !== S.rules.ssTaxa) ch.push(`SS: ${S.rules.ssTaxa*100}% → ${nr.ssTaxa*100}%`);
    if (nr.ssCoeficiente !== S.rules.ssCoeficiente) ch.push(`Coeficiente SS: ${S.rules.ssCoeficiente*100}% → ${nr.ssCoeficiente*100}%`);
    if (JSON.stringify(nr.prazos) !== JSON.stringify(S.rules.prazos)) ch.push(`Prazos: ${nr.prazos.length} datas atualizadas`);
    if (!ch.length){ toast('As regras já estão atualizadas'); S.settings.regrasUrl = url; save(); return; }
    if (!await ask('Mudanças nas regras:\n\n' + ch.join('\n'), { ok:'Aceitar mudanças' })) return;
    S.rules = { ...DEFAULT_RULES, ...nr }; S.settings.regrasUrl = url; save(); toast('Regras atualizadas'); render();
  } catch(e){ toast('Não consegui atualizar. A app continua com as regras atuais.'); }
}
function download(name, content, type){
  const blob = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- Login / primeira vez ---------- */
async function renderLogin(){
  VAULT = await readVault();
  const first = !VAULT;
  const logo = `<div class="logo"><svg width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="28" fill="#FDF6EC"/><path d="M32 74 A28 28 0 0 1 88 74 Z" fill="#F59E0B"/><line x1="22" y1="74" x2="98" y2="74" stroke="#0E1B2C" stroke-width="6" stroke-linecap="round"/><line x1="36" y1="90" x2="84" y2="90" stroke="#0F766E" stroke-width="6" stroke-linecap="round"/></svg></div>`;
  app.innerHTML = `<main class="login">
    ${logo}
    <div><h1 style="font-size:28px">Pura Vida</h1><p class="muted" style="margin:6px 0 0">${first ? 'Cria uma palavra-passe. Os teus dados ficam encriptados só neste telemóvel.' : 'Introduz a palavra-passe para entrar.'}</p></div>
    <form id="lf" style="display:flex;flex-direction:column;gap:12px">
      <input type="text" name="username" autocomplete="username" value="Pura Vida" class="sr" tabindex="-1" aria-hidden="true">

      <p class="note blue">A seguir recebes um código de recuperação, para entrares se te esqueceres da palavra-passe.</p>` : ''}
      <button class="btn" type="submit" id="lb">${first ? 'Criar e entrar' : 'Entrar'}</button>
      ${first ? '' : `<button class="btn sec" type="button" id="forgot" style="border:none;background:transparent;color:var(--teal);height:44px">Esqueci-me da palavra-passe</button>`}
    </form>
  </main>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const p = $('#lp').value; const btn = $('#lb'); btn.disabled = true; btn.textContent = 'A abrir…';
    try {
      if (first){
        if (p.length < 8) throw new Error('A palavra-passe precisa de pelo menos 8 caracteres');
        if (p !== $('#lp2').value) throw new Error('As palavras-passe não coincidem');
        const { fields, code } = await newVaultKeys(p);
        VAULT = fields;
        // guarda logo, para a palavra-passe ficar criada mesmo que a app feche a meio
        S = freshState(); S.onboarded = false; await saveNow();
        showRecoveryCode(code, onboarding);
        return;
      }
      const r = await openWithPass(VAULT, p);
      S = r.data; KEY = r.key; DEK_RAW = r.raw; migrate();
      if (r.legacy){
        // cofre antigo (v1.0): passa a ter código de recuperação
        const { fields, code } = await newVaultKeys(p); VAULT = fields; await saveNow();
        showRecoveryCode(code, () => { location.hash = location.hash || 'hoje'; render(); });
        return;
      }
      if (S.onboarded === false){ onboarding(); return; }
      location.hash = location.hash || 'hoje'; render();
    } catch(err){
      KEY = null; DEK_RAW = null; S = null; btn.disabled = false; btn.textContent = first ? 'Criar e entrar' : 'Entrar';
      toast(err && err.message && first ? err.message : 'Palavra-passe errada');
    }
  };
  const fg = $('#forgot'); if (fg) fg.onclick = recoveryFlow;
}
function showRecoveryCode(code, next){
  closeSheet(true);

    <button class="btn sec" type="button" id="rcCopy">Copiar código</button>

async function recoveryFlow(){
  VAULT = await readVault();
  if (!VAULT || VAULT.v !== 2){ toast('Esta versão dos dados ainda não tem código de recuperação'); return; }
  app.innerHTML = `<main class="login">
    <div><h1 style="font-size:24px">Recuperar acesso</h1><p class="muted" style="margin:6px 0 0">Escreve o código de recuperação (com ou sem traços) e escolhe uma palavra-passe nova.</p></div>
    <form id="rf" style="display:flex;flex-direction:column;gap:12px" autocomplete="off">
      <label class="field"><span>Código de recuperação</span><input class="input" id="rcIn" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" style="font-family:ui-monospace,Menlo,monospace"></label>
      <input type="text" name="username" autocomplete="username" value="Pura Vida" class="sr" tabindex="-1" aria-hidden="true">
      <label class="field"><span>Nova palavra-passe (mín. 8)</span><input class="input" type="password" id="rp1" autocomplete="new-password"></label>
      <label class="field"><span>Repetir</span><input class="input" type="password" id="rp2" autocomplete="new-password"></label>
      <button class="btn" type="submit" id="rb">Recuperar e entrar</button>
      <button class="btn sec" type="button" id="rBack" style="border:none;background:transparent">Voltar</button>
    </form></main>`;
  $('#rBack').onclick = renderLogin;
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    const p1 = $('#rp1').value, p2 = $('#rp2').value, btn = $('#rb');
    if (normCode($('#rcIn').value).length !== 24){ toast('O código tem 24 letras e números'); return; }
    if (p1.length < 8){ toast('A palavra-passe precisa de pelo menos 8 caracteres'); return; }
    if (p1 !== p2){ toast('As palavras-passe não coincidem'); return; }
    btn.disabled = true; btn.textContent = 'A verificar…';
    try {
      const r = await openWithCode(VAULT, $('#rcIn').value);
      KEY = r.key; DEK_RAW = r.raw; S = r.data;
      await rewrapPass(p1); writeVault(VAULT); migrate();
      location.hash = 'hoje'; render(); toast('Palavra-passe nova criada. O teu código continua válido.');
    } catch(err){ btn.disabled = false; btn.textContent = 'Recuperar e entrar'; toast('Código errado'); }
  };
}
